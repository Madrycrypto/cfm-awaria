    return subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return subtle.deriveBits({ name: 'PBKDF2', salt: b64(ENC.s), iterations: ENC.n, hash: 'SHA-256' }, k, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function open(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) {
      return subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.i) }, k, b64(ENC.c));
    }).then(function (pt) {
      var html = new TextDecoder().decode(window.pako.ungzip(new Uint8Array(pt)));
      try { localStorage.setItem('lc-r', tob64(raw)); } catch (e) {}
      document.open(); document.write(html); document.close();
    });
  }
  function start() {
    if (!subtle) { fail('Wymagane https / 需要 https'); return; }
    var h = location.hash || '', m;
    if (h) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    var stored = null; try { stored = localStorage.getItem('lc-r'); } catch (e) {}
    var p = null;
    if ((m = h.match(/^#r=([\w-]+)/))) p = open(b64(m[1]));
    else if ((m = h.match(/^#k=(.+)$/))) p = derive(decodeURIComponent(m[1])).then(open);
    else if (stored) p = open(b64(stored));
    if (p) p.catch(function () { try { localStorage.removeItem('lc-r'); } catch (e) {} if (h || stored) fail('Nieprawidłowy lub nieaktualny kod / 访问码无效或已过期'); });
  }
  $('f').onsubmit = function (e) {
    e.preventDefault(); $('err').textContent = '…';
    derive($('code').value.trim()).then(open).catch(function () { fail('Nieprawidłowy kod / 访问码错误'); });
  };
  window.addEventListener('hashchange', function () { if (/^#(k|r)=/.test(location.hash)) start(); });
  start();
})();
</script>
