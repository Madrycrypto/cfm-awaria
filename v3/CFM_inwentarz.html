<title>CFM · Inwentarz</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#161616;--surface-2:#1c1c1c;--border:#262626;--border-soft:#1e1e1e;
  --text:#f2f2f2;--muted:#9a9a9a;--faint:#5c5c5c;
  --blue:#1A6ED8;--blue-soft:#2f7fe0;--green:#1A9E50;--red:#D92B2B;--orange:#D97706;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fc:'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:60px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.cn{font-family:var(--fc);color:var(--faint);font-weight:400}
::selection{background:var(--blue);color:#fff}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.navmenu-wrap{position:relative}
.navmenu-btn{background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:16px;padding:3px 9px;cursor:pointer;line-height:1.6}
.navmenu-btn:hover{color:var(--text)}
.navmenu-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#161616;border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;flex-direction:column;gap:2px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.navmenu-dropdown.open{display:flex}
.navmenu-dropdown a{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:0.02em;color:var(--muted);text-decoration:none;padding:9px 10px;border-radius:7px;white-space:nowrap}
.navmenu-dropdown a:hover{color:var(--text);background:var(--surface-2)}
.navmenu-dropdown a.on{color:#fff;background:var(--blue)}
.topbar-right{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
.topbar-right .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.topbar-right .live.off{color:var(--red)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-pulse{animation:none}}

.pagehead{padding:28px 0 18px}
h1{font-family:var(--fh);font-weight:800;font-size:30px;letter-spacing:0.2px}
h1 .cn{font-family:var(--fc);font-size:16px;font-weight:500;margin-left:8px}
.sub{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.6}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
.kpi-lbl .cn{display:block;text-transform:none;font-size:11px;margin-top:2px;letter-spacing:0}
.kpi-val{font-family:var(--fh);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;margin-top:8px;font-weight:600;color:var(--faint)}

.section{margin-bottom:26px}
.section-head{margin-bottom:12px}
.section-head h2{font-family:var(--fh);font-weight:700;font-size:19px;letter-spacing:0.2px}
.section-head h2 .cn{font-family:var(--fc);font-size:13px;font-weight:500;margin-left:6px}

.formcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.field input{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;color:var(--text);font-family:var(--fh);font-weight:700;font-size:14px;padding:9px 10px;font-variant-numeric:tabular-nums}
.field input:focus{outline:none;border-color:var(--blue)}
.btn-save{font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:#fff;background:var(--blue);border:none;padding:11px 20px;border-radius:9px;cursor:pointer}
.btn-save:hover{filter:brightness(1.1)}

.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tablescroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
thead th{font-family:var(--fb);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr.today td{background:rgba(26,110,216,0.08)}
.balance{font-weight:800;color:var(--text)}
.recount{color:var(--blue-soft);font-weight:700}
.diff-pos{color:#3fd17a}
.diff-neg{color:#ff7070}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(26,158,80,0.4);color:#3fd17a}
.toast.err{border-color:rgba(217,43,43,0.4);color:#ff7070}

.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.8}

.hero{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.hero .n{font-family:var(--fh);font-weight:800;font-size:34px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero-sub{font-size:12px;color:var(--faint);margin-bottom:16px}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700;margin-left:6px}
.tag.plan{background:rgba(154,154,154,0.15);color:var(--muted)}
.tag.actual{background:rgba(47,127,224,0.18);color:var(--blue-soft)}
tbody tr.negative td{background:rgba(217,43,43,0.14)}
.balance.neg{color:var(--red)}
.balance.ok{color:#3fd17a}
.configrow{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.configrow .field input{width:180px}
.configrow .hint{font-size:11px;color:var(--faint);flex-basis:100%}
.monthnav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;margin-bottom:14px}
.monthnav button{background:none;border:none;color:var(--muted);font-size:18px;padding:6px 14px;cursor:pointer;border-radius:8px;font-family:var(--fh)}
.monthnav button:hover{color:var(--text);background:var(--surface-2)}
.simhint{font-size:11px;color:var(--faint);margin-bottom:12px;line-height:1.5}
.btn-clearsim{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:4px}
.btn-clearsim:hover{color:var(--text);border-color:var(--muted)}
.cellinput{width:70px;background:transparent;border:1px solid transparent;color:var(--text);font-family:inherit;font-size:inherit;text-align:right;border-radius:6px;padding:2px 6px}
.cellinput:hover{border-color:var(--border)}
.cellinput:focus{border-color:var(--blue-soft);outline:none;background:var(--surface-2)}
.cellinput.overridden{color:#f0a030;border-color:rgba(240,160,48,0.4);background:rgba(240,160,48,0.08)}
.monthnav .mlabel{font-family:var(--fh);font-weight:700;font-size:14px;letter-spacing:0.3px;text-transform:capitalize;min-width:140px;text-align:center}

@media (max-width:760px){
  .kpis{grid-template-columns:1fr}
  h1{font-size:24px}
}

/* Brama PINem — te 4 strony (Premie, Plan, Obsada, Inwentarz) sa mniej
   zaufane niz Raport dzienny (dane place/kadrowe/magazynowe), wiec
   wymagaja tego samego PIN-u co Panel Admina (localStorage cfm_pin,
   domyslnie 1234, zmienialny w Panelu Admina w Raporcie dziennym).
   Overlay jest WIDOCZNY DOMYSLNIE (nie odwrotnie jak w Panelu Admina) —
   zeby nie bylo widac tresci strony nawet na uamek sekundy zanim JS
   zdazy go pokazac. sessionStorage (nie localStorage) — odblokowanie
   trzyma sie tylko do zamkniecia karty/przegladarki, nie na stale. */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:flex;align-items:center;justify-content:center}
.pin-overlay.hidden{display:none}
.pin-dialog{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 22px;width:300px;max-width:90vw;text-align:center}
.pin-dialog-title{font-family:var(--fh);font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.pin-dialog-sub{font-size:12px;color:var(--muted);margin-bottom:18px;font-family:var(--fb)}
.pin-dialog-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--fh);font-size:28px;letter-spacing:0.25em;text-align:center;padding:14px;margin-bottom:14px}
.pin-dialog-err{display:none;color:var(--red);font-size:12px;margin-bottom:10px}
.pin-dialog-ok{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:var(--fh);font-size:18px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;padding:13px;cursor:pointer}
.pin-dialog-back{display:block;margin-top:14px;font-size:12px;color:var(--muted);text-decoration:none}
.pin-dialog-back:hover{color:var(--text)}
</style>
</head>

  <div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>

<div class="wrap" id="solderApp"></div>

<div class="toast" id="toast"></div>

<script>
var DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw1WjHbfYGIoX6Ik4MLqZpfS8gp1FzHyRLPciOdkSu8vGdJewFtEyC2aKobpLO9m6S7JA/exec';
function getWH() { return localStorage.getItem('cfm_raport_webhook') || DEFAULT_WEBHOOK; }

var STATE = { inventoryCounts: {}, shippingActual: {}, rows: [], solderInventoryCounts: {}, monthlyPlan: {}, solderRows: [], solderMonthDate: new Date(), solderFirstDate: null, solderOverrides: {} };

function pad(n) { return String(n).padStart(2, '0'); }
function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isoToDate(iso) { var p = iso.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
var DAY_LABELS = ['PON','WT','ŚR','CZW','PT','SOB','NDZ'];
function fmt(n) { return n === null || n === undefined ? '&#8212;' : n.toLocaleString('pl-PL'); }

function showToast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  setTimeout(function() { t.className = 'toast ' + (kind || ''); }, 2400);
}

function enumerateDays(startIso, endIso) {
  var days = [];
  var cursor = isoToDate(startIso);
  var end = isoToDate(endIso);
  while (cursor <= end) { days.push(toISO(cursor)); cursor = addDays(cursor, 1); }
  return days;
}
function shippingActualFor(dateIso) {
  var mk = dateIso.slice(0, 7);
  var v = STATE.shippingActual[mk] && STATE.shippingActual[mk][dateIso];
  return v ? Number(v) : 0;
}

function init() {
  var wh = getWH();
  var liveEl = document.getElementById('liveStatus');
  fetch(wh + '?event_type=GET_USTAWIENIA')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'ok') { showConnError(); return; }
      var u = data.ustawienia || {};
      try { STATE.inventoryCounts = JSON.parse(u.cfm_inventory_counts || '{}'); } catch (e) { STATE.inventoryCounts = {}; }
      try { STATE.shippingActual = JSON.parse(u.cfm_shipping_actual || '{}'); } catch (e) { STATE.shippingActual = {}; }
      try { STATE.solderInventoryCounts = JSON.parse(u.cfm_solder_inventory_counts || '{}'); } catch (e) { STATE.solderInventoryCounts = {}; }
      try { STATE.monthlyPlan = JSON.parse(u.cfm_monthly_plan || '{}'); } catch (e) { STATE.monthlyPlan = {}; }
      // cfm_solder_config synchronizowany jak reszta ustawien (zapisywany
      // lokalnie od razu przy zapisie, ale przy STARCIE trzeba go tez
      // pobrac z serwera - inaczej inne urzadzenie/przegladarka nigdy by
      // go nie zobaczylo i zawsze uzywaloby domyslnych "Grupa A/B/Lutowanie").
      if (u.cfm_solder_config) {
        try { localStorage.setItem('cfm_solder_config', u.cfm_solder_config); } catch (e) {}
      }
      // Symulacja "co jesli" na buforze — czysto lokalna, nigdy nie
      // dotyka Planu ani serwera, wiec zyje tylko w localStorage tej
      // przegladarki.
      try { STATE.solderOverrides = JSON.parse(localStorage.getItem('cfm_solder_overrides') || '{}'); } catch (e) { STATE.solderOverrides = {}; }
      liveEl.className = 'live';
      liveEl.innerHTML = '<span class="live-pulse"></span>połączono <span class="cn">已连接</span>';
      loadAndRender();
      loadSolderAndRender();
    })
    .catch(function() { showConnError(); });
}

function showConnError() {
  var liveEl = document.getElementById('liveStatus');
  liveEl.className = 'live off';
  liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
  document.getElementById('app').innerHTML = '<div class="empty">Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span></div>';
}

// Symulacja liczona od NAJSTARSZEJ zapisanej inwentaryzacji do dzis —
// kazda kolejna inwentaryzacja PO drodze resetuje saldo do faktycznie
// policzonej wartosci (i pokazuje roznice: ubytek/nadwyzka), a miedzy
// resetami saldo = poprzednie saldo + dobre sztuki z GP12 - wyslano
// (faktycznie, z Planu). Produkcje GP12 pobieramy z tego samego
// STATYSTYKI co reszta apki (ok_count), zeby liczba byla identyczna z
// tym co juz widac w Statystykach/OEE.
function loadAndRender() {
  var countDates = Object.keys(STATE.inventoryCounts).sort();
  if (!countDates.length) {
    renderNoBaseline();
    return;
  }
  var firstDate = countDates[0];
  var todayISO = toISO(new Date());
  var wh = getWH();
  fetch(wh + '?event_type=STATYSTYKI&start=' + firstDate + '&end=' + todayISO)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status !== 'ok') { showConnError(); return; }
      STATE.rows = (data.historia || []).filter(function(r) { return r.station === 'GP12'; });
      render(firstDate, todayISO);
    })
    .catch(function() { showConnError(); });
}

function renderNoBaseline() {
  document.getElementById('app').innerHTML =
    '<div class="pagehead"><h1>Inwentarz <span class="cn">库存</span></h1><div class="sub">Brak zapisanej inwentaryzacji — wpisz pierwszy punkt odniesienia (ile sztuk jest fizycznie na magazynie DZISIAJ), żeby zacząć liczyć saldo na żywo.<br><span class="cn">还没有库存盘点记录 — 请先输入今天的实际库存数量，才能开始自动计算库存余额。</span></div></div>' +
    formHtml();
  wireForm();
}

function render(firstDate, todayISO) {
  var prodByDate = {};
  STATE.rows.forEach(function(r) { prodByDate[r.date] = (prodByDate[r.date] || 0) + (Number(r.ok_count) || 0); });

  var days = enumerateDays(firstDate, todayISO);
  var running = Number(STATE.inventoryCounts[firstDate]) || 0;
  var out = [];
  days.forEach(function(d, idx) {
    var prod = prodByDate[d] || 0;
    var ship = shippingActualFor(d);
    var countToday = STATE.inventoryCounts[d] !== undefined ? Number(STATE.inventoryCounts[d]) : null;
    var discrepancy = null;
    if (idx > 0) running += prod - ship;
    if (countToday !== null && idx > 0) { discrepancy = countToday - running; running = countToday; }
    out.push({ date: d, production: prod, shipped: ship, balance: running, counted: countToday, discrepancy: discrepancy });
  });

  var todayRow = out[out.length - 1];
  var lastCountDate = firstDate;
  Object.keys(STATE.inventoryCounts).forEach(function(d) { if (d <= todayISO && d > lastCountDate) lastCountDate = d; });
  var daysSince = Math.round((isoToDate(todayISO) - isoToDate(lastCountDate)) / 86400000);

  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="pagehead"><h1>Inwentarz <span class="cn">库存</span></h1><div class="sub">Stan liczony na żywo: ostatnia inwentaryzacja + dobre sztuki z GP12 &#8722; wysłano (z Planu). <span class="cn">实时库存 = 上次盘点 + GP12合格数量 &#8722; 实际发货数量。</span></div></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="kpi-lbl">Stan dzisiaj (liczony)<span class="cn">今日库存（计算）</span></div><div class="kpi-val">' + fmt(todayRow.balance) + '</div><div class="kpi-sub">szt. &#183; 件</div></div>' +
      '<div class="kpi"><div class="kpi-lbl">Ostatnia inwentaryzacja<span class="cn">上次盘点</span></div><div class="kpi-val">' + fmt(Number(STATE.inventoryCounts[lastCountDate])) + '</div><div class="kpi-sub">' + fmtDateLabel(lastCountDate) + ' &#183; ' + daysSince + ' dni temu</div></div>' +
      '<div class="kpi"><div class="kpi-lbl">Od inwentaryzacji<span class="cn">自盘点以来</span></div><div class="kpi-val">' + (todayRow.balance - Number(STATE.inventoryCounts[lastCountDate]) >= 0 ? '+' : '') + fmt(todayRow.balance - Number(STATE.inventoryCounts[lastCountDate])) + '</div><div class="kpi-sub">produkcja &#8722; wysyłki &#183; 生产-发货</div></div>' +
    '</div>' +
    '<div class="section"><div class="section-head"><h2>Nowa inwentaryzacja<span class="cn">新盘点</span></h2></div>' + formHtml() + '</div>' +
    '<div class="section"><div class="section-head"><h2>Saldo dzień po dniu<span class="cn">逐日库存余额</span></h2></div>' +
    '<div class="tablewrap"><div class="tablescroll"><table><thead><tr>' +
      '<th>Dzień<span class="cn">日期</span></th><th>Produkcja GP12<span class="cn">GP12产量</span></th><th>Wysłano<span class="cn">发货</span></th><th>Saldo<span class="cn">余额</span></th><th>Inwentaryzacja<span class="cn">盘点</span></th>' +
    '</tr></thead><tbody>' +
      out.slice().reverse().map(function(r) {
        var dd = r.date.split('-');
        var wd = isoToDate(r.date).getDay();
        var label = DAY_LABELS[(wd + 6) % 7] + ' ' + dd[2] + '/' + dd[1] + (r.date === todayISO ? ' &#183; dziś' : '');
        var countCell = r.counted === null ? '&#8212;' :
          '<span class="recount">' + fmt(r.counted) + '</span>' + (r.discrepancy !== null ? ' <span class="' + (r.discrepancy >= 0 ? 'diff-pos' : 'diff-neg') + '">(' + (r.discrepancy >= 0 ? '+' : '') + fmt(r.discrepancy) + ')</span>' : '');
        return '<tr class="' + (r.date === todayISO ? 'today' : '') + '"><td>' + label + '</td><td>' + fmt(r.production) + '</td><td>' + fmt(r.shipped) + '</td><td class="balance">' + fmt(r.balance) + '</td><td>' + countCell + '</td></tr>';
      }).join('') +
    '</tbody></table></div></div></div>';

  wireForm();
}

function fmtDateLabel(iso) {
  var dd = iso.split('-');
  return dd[2] + '/' + dd[1] + '/' + dd[0];
}

function formHtml() {
  var todayISO = toISO(new Date());
  return '<div class="formcard">' +
    '<div class="field"><label>Data &#183; 日期</label><input type="date" id="invDate" value="' + todayISO + '"></div>' +
    '<div class="field"><label>Ilość policzona fizycznie &#183; 实际盘点数量</label><input type="number" min="0" id="invQty" placeholder="np. 15000"></div>' +
    '<button type="button" class="btn-save" id="btnSaveInv">Zapisz inwentaryzację<br><small style="font-family:var(--fb);font-weight:400;text-transform:none">保存盘点</small></button>' +
  '</div>';
}

function wireForm() {
  var btn = document.getElementById('btnSaveInv');
  if (btn) btn.onclick = saveInventoryCount;
}

function saveInventoryCount() {
  var dateEl = document.getElementById('invDate');
  var qtyEl = document.getElementById('invQty');
  var d = dateEl.value;
  var q = Number(qtyEl.value);
  if (!d) { showToast('Wybierz datę &#183; 请选择日期', 'err'); return; }
  if (!q || q < 0) { showToast('Wpisz poprawną ilość &#183; 请输入正确数量', 'err'); return; }
  STATE.inventoryCounts[d] = q;
  var wh = getWH();
  fetch(wh, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_inventory_counts', wartosc: JSON.stringify(STATE.inventoryCounts) })
  }).then(function() {
    showToast('Inwentaryzacja zapisana! &#183; 盘点已保存!', 'ok');
    loadAndRender();
  }).catch(function() {
    showToast('Błąd zapisu &#183; 保存失败', 'err');
  });
}

// ── BUFOR CHŁODNIC ZLUTOWANYCH ───────────────────────────────────────
// Dwustronny bufor: JEDNA stacja DOKLADA (lutowanie), JEDNA stacja
// ODEJMUJE (stacja docelowa, zwykle GP12 - tyle chlodnic zuzywa ile sama
// produkuje). Cel: odpowiedziec "czy zaplanowane lutowanie starczy na
// caly zaplanowany montaz w tym miesiacu" - wiec tabela pokazuje CALY
// (dowolny, z nawigacja jak w Planie) miesiac, nie sztywne okno dni.
// Dni juz zaraportowane licza sie z realnego wykonania (RaportDzienny),
// dni przyszle - z Planu, a jesli dla danego dnia nie ma jawnego wpisu w
// Planie - z Celu stanowiska (ZAWSZE, w odroznieniu od Statystyk/wykonania
// planu — to jest prognoza w przod, nie ocena, wiec potrzebuje zalozenia
// nawet na niezaplanowane wczesniej soboty; jak tylko przyjdzie prawdziwy
// raport, dzien automatycznie zamienia sie z "plan" na "actual").
function getSolderConfig() {
  var s = localStorage.getItem('cfm_solder_config');
  var d = { produkcja: 'Lutowanie', zuzycie: 'GP12' };
  if (!s) return d;
  try { return Object.assign(d, JSON.parse(s)); } catch (e) { return d; }
}
function saveSolderConfig(cfg) {
  localStorage.setItem('cfm_solder_config', JSON.stringify(cfg));
  var wh = getWH();
  fetch(wh, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_solder_config', wartosc: JSON.stringify(cfg) })
  }).catch(function() {});
}
var SOLDER_MONTH_NAMES = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function monthDays(monthDate) {
  var y = monthDate.getFullYear(), m = monthDate.getMonth();
  var days = [];
  var d = new Date(y, m, 1);
  while (d.getMonth() === m) { days.push(toISO(d)); d.setDate(d.getDate() + 1); }
  return days;
}
// Suma jawnych wpisow w Planie (wszystkie zmiany) dla stanowiska/dnia.
// Bez fallbacku na Cel: lutowanie (i podobne stanowiska) NIE pracuje
// kazdego dnia roboczego, wiec zakladanie "normalny dzien = Cel" byloby
// falszywe (przeszacowywaloby bufor w dni, ktore w ogole nie sa
// zaplanowane). Brak jawnego wpisu w Planie na dany dzien = 0, kropka —
// wowczas bufor odzwierciedla DOKLADNIE to, co admin faktycznie
// zaplanowal w CFM_plan, a nie domysl.
function planSumForDay(station, dateIso) {
  station = String(station || '').trim();
  var mk = dateIso.slice(0, 7);
  var stPlan = STATE.monthlyPlan[mk] && STATE.monthlyPlan[mk][station];
  var sum = 0;
  if (stPlan) {
    Object.keys(stPlan).forEach(function(shift) {
      var v = stPlan[shift] && stPlan[shift][dateIso];
      if (v) sum += Number(v) || 0;
    });
  }
  return sum;
}
// Suma actual (wszystkie zmiany) dla stanowiska/dnia z podanych wierszy;
// null = brak jakiegokolwiek raportu tego dnia dla tej stacji (dzien
// jeszcze sie nie odbyl, albo po prostu nikt nie zlozyl raportu).
// Porownanie nazwy stanowiska po trim() - typowy blad to przypadkowa
// spacja na koncu pola konfiguracji, ktora inaczej cichutko zerowalaby
// caly bilans bez zadnego komunikatu o bledzie.
function actualSumForDay(rows, station, dateIso) {
  var target = String(station || '').trim();
  var sum = 0, has = false;
  rows.forEach(function(r) { if (String(r.station || '').trim() === target && r.date === dateIso) { sum += Number(r.qty) || 0; has = true; } });
  return has ? sum : null;
}
function loadSolderAndRender() {
  var countDates = Object.keys(STATE.solderInventoryCounts).sort();
  var todayISO = toISO(new Date());
  if (!countDates.length) { renderSolderNoBaseline(); return; }
  var firstDate = countDates[0];
  var wh = getWH();
  fetch(wh + '?event_type=STATYSTYKI&start=' + firstDate + '&end=' + todayISO)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status !== 'ok') return;
      STATE.solderRows = data.historia || [];
      renderSolderSection(firstDate);
    })
    .catch(function() {});
}
function renderSolderNoBaseline() {
  var cfg = getSolderConfig();
  document.getElementById('solderApp').innerHTML =
    '<div class="section"><div class="section-head"><h2>Bufor chłodnic zlutowanych<span class="cn">已焊接散热器缓冲区</span></h2></div>' +
    '<div class="empty">Brak zapisanej inwentaryzacji bufora lutowania — wpisz pierwszy punkt odniesienia poniżej, żeby zacząć liczyć zasięg.<br><span class="cn">还没有焊接缓冲区盘点记录 — 请先输入一个基准数量。</span></div>' +
    solderConfigHtml(cfg) + solderFormHtml() + '</div>';
  wireSolderConfig(); wireSolderForm();
}
// Pelny bilans dzien-po-dniu od firstDate do endIso WLACZNIE. idx=0
// (firstDate) to punkt startowy inwentaryzacji, nie liczy sie do
// "actual/plan". Saldo pokazane przy dniu X to stan NA POCZATEK dnia X —
// produkcja/zuzycie WYPISANE przy dniu X dotycza tego, co sie wydarzy
// W CIAGU dnia X i wplywaja dopiero na saldo dnia X+1 (dokladnie tak jak
// w arkuszu usera: 1980 -200-600+0 = 1180 na NASTEPNY dzien, nie na ten sam).
function computeSolderWalk(firstDate, endIso, cfg) {
  var todayISO = toISO(new Date());
  var days = enumerateDays(firstDate, endIso);
  var running = Number(STATE.solderInventoryCounts[firstDate]) || 0;
  var out = [];
  var wentNegativeAt = null;
  var prevProd = null, prevUse = null;
  days.forEach(function(d, idx) {
    var aProd = actualSumForDay(STATE.solderRows, cfg.produkcja, d);
    var aUse = actualSumForDay(STATE.solderRows, cfg.zuzycie, d);
    var isActual = aProd !== null || aUse !== null;
    var prod = aProd !== null ? aProd : planSumForDay(cfg.produkcja, d);
    var use = aUse !== null ? aUse : planSumForDay(cfg.zuzycie, d);
    // Reczna symulacja "co jesli" nadpisuje wszystko inne (actual/plan) —
    // to celowo lokalny "co by bylo gdyby", niezalezny od Planu/raportow.
    var ov = STATE.solderOverrides[d];
    var overrideProd = ov && ov.produkcja !== undefined;
    var overrideUse = ov && ov.zuzycie !== undefined;
    if (overrideProd) prod = ov.produkcja;
    if (overrideUse) use = ov.zuzycie;
    if (idx > 0) running += prevProd - prevUse;
    var countToday = STATE.solderInventoryCounts[d] !== undefined ? Number(STATE.solderInventoryCounts[d]) : null;
    if (countToday !== null && idx > 0) running = countToday;
    if (wentNegativeAt === null && running < 0 && d > todayISO) wentNegativeAt = d;
    out.push({ date: d, produkcja: prod, zuzycie: use, balance: running, isActual: idx === 0 ? true : isActual, isToday: d === todayISO, overrideProd: overrideProd, overrideUse: overrideUse });
    prevProd = prod; prevUse = use;
  });
  return { rows: out, wentNegativeAt: wentNegativeAt };
}
function solderConfigHtml(cfg) {
  return '<div class="configrow">' +
    '<div class="field"><label>Stanowisko - produkcja (lutowanie) &#183; 生产工位（焊接）</label><input type="text" id="cfgProdukcja" value="' + cfg.produkcja + '"></div>' +
    '<div class="field"><label>Stanowisko - zużycie (montaż) &#183; 消耗工位（装配）</label><input type="text" id="cfgZuzycie" value="' + cfg.zuzycie + '"></div>' +
    '<button type="button" class="btn-save" id="btnSaveSolderCfg">Zapisz nazwy<br><small style="font-family:var(--fb);font-weight:400;text-transform:none">保存名称</small></button>' +
    '<div class="hint">Wpisz TU dokładnie te same nazwy stanowisk, co w Panelu Admina → Stanowiska/Plan &#183; 请输入与管理面板中完全一致的工位名称</div>' +
  '</div>';
}
function solderFormHtml() {
  var todayISO = toISO(new Date());
  return '<div class="formcard">' +
    '<div class="field"><label>Data &#183; 日期</label><input type="date" id="solderInvDate" value="' + todayISO + '"></div>' +
    '<div class="field"><label>Ilość policzona fizycznie &#183; 实际盘点数量</label><input type="number" min="0" id="solderInvQty" placeholder="np. 1980"></div>' +
    '<button type="button" class="btn-save" id="btnSaveSolderInv">Zapisz inwentaryzację<br><small style="font-family:var(--fb);font-weight:400;text-transform:none">保存盘点</small></button>' +
  '</div>';
}
function wireSolderConfig() {
  var btn = document.getElementById('btnSaveSolderCfg');
  if (btn) btn.onclick = function() {
    var cfg = {
      produkcja: document.getElementById('cfgProdukcja').value.trim() || 'Lutowanie',
      zuzycie: document.getElementById('cfgZuzycie').value.trim() || 'GP12',
    };
    saveSolderConfig(cfg);
    showToast('Nazwy zapisane! &#183; 名称已保存!', 'ok');
    loadSolderAndRender();
  };
}
function wireSolderForm() {
  var btn = document.getElementById('btnSaveSolderInv');
  if (btn) btn.onclick = saveSolderInventoryCount;
}
function saveSolderInventoryCount() {
  var d = document.getElementById('solderInvDate').value;
  var q = Number(document.getElementById('solderInvQty').value);
  if (!d) { showToast('Wybierz datę &#183; 请选择日期', 'err'); return; }
  if (!q || q < 0) { showToast('Wpisz poprawną ilość &#183; 请输入正确数量', 'err'); return; }
  STATE.solderInventoryCounts[d] = q;
  var wh = getWH();
  fetch(wh, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_solder_inventory_counts', wartosc: JSON.stringify(STATE.solderInventoryCounts) })
  }).then(function() {
    showToast('Inwentaryzacja zapisana! &#183; 盘点已保存!', 'ok');
    loadSolderAndRender();
  }).catch(function() {
    showToast('Błąd zapisu &#183; 保存失败', 'err');
  });
}
function prevSolderMonth() { STATE.solderMonthDate = new Date(STATE.solderMonthDate.getFullYear(), STATE.solderMonthDate.getMonth() - 1, 1); renderSolderSection(STATE.solderFirstDate); }
function nextSolderMonth() { STATE.solderMonthDate = new Date(STATE.solderMonthDate.getFullYear(), STATE.solderMonthDate.getMonth() + 1, 1); renderSolderSection(STATE.solderFirstDate); }
function renderSolderSection(firstDate) {
  STATE.solderFirstDate = firstDate;
  var cfg = getSolderConfig();
  var todayISO = toISO(new Date());
  var mDays = monthDays(STATE.solderMonthDate);
  // Bilans musi byc liczony NIEPRZERWANIE od pierwszej inwentaryzacji -
  // saldo sie nie zeruje na poczatku miesiaca. Koniec walka to ostatni
  // dzien PRZEGLADANEGO miesiaca (dla przeszlych/biezacych miesiecy) albo
  // dalej, jesli trzeba wykryc pierwszy ujemny dzien do naglowka ("na ile
  // starczy") nawet gdy wypada POZA przegladanym miesiacem.
  var horizonEnd = new Date(); horizonEnd.setDate(horizonEnd.getDate() + 60);
  var horizonEndIso = toISO(horizonEnd);
  var walkEnd = mDays[mDays.length - 1] > horizonEndIso ? mDays[mDays.length - 1] : horizonEndIso;
  var timeline = computeSolderWalk(firstDate, walkEnd, cfg);
  var rows = timeline.rows;
  var byDate = {};
  rows.forEach(function(r) { byDate[r.date] = r; });

  var todayRow = byDate[todayISO];
  var daysUntilNegative = null;
  if (timeline.wentNegativeAt) {
    daysUntilNegative = Math.round((isoToDate(timeline.wentNegativeAt) - isoToDate(todayISO)) / 86400000);
  }
  var heroColor = daysUntilNegative === null ? '#3fd17a' : (daysUntilNegative <= 3 ? '#ff7070' : '#f0a030');
  var heroText = daysUntilNegative === null ? 'ponad 60 dni zapasu' : (daysUntilNegative + ' dni zapasu');
  var heroSub = daysUntilNegative === null
    ? 'w ciągu najbliższych 60 dni bufor nie powinien się wyczerpać (na podstawie Planu/Celu)'
    : 'bufor spadnie poniżej zera ok. ' + fmtDateLabel(timeline.wentNegativeAt) + ' — trzeba dolutować więcej';

  // Widoczna tabela = TYLKO przegladany miesiac (nawigacja jak w Planie),
  // ale kazdy wiersz ma juz poprawne saldo z pelnego, nieprzerwanego walku.
  var visible = mDays.map(function(d) { return byDate[d]; }).filter(Boolean);

  var hasOverrides = Object.keys(STATE.solderOverrides).length > 0;

  var app = document.getElementById('solderApp');
  app.innerHTML =
    '<div class="section"><div class="section-head"><h2>Bufor chłodnic zlutowanych<span class="cn">已焊接散热器缓冲区</span></h2></div>' +
    '<div class="hero"><span class="n" style="color:' + heroColor + '">' + heroText + '</span></div>' +
    '<div class="hero-sub">stan dzisiaj: ' + fmt(todayRow ? todayRow.balance : null) + ' szt. &#183; ' + heroSub + '</div>' +
    solderConfigHtml(cfg) +
    '<div class="monthnav"><button type="button" onclick="prevSolderMonth()">&#8249;</button><div class="mlabel">' + SOLDER_MONTH_NAMES[STATE.solderMonthDate.getMonth()] + ' ' + STATE.solderMonthDate.getFullYear() + '</div><button type="button" onclick="nextSolderMonth()">&#8250;</button></div>' +
    '<div class="simhint">Kliknij liczbę w kolumnie ' + cfg.produkcja + ' / ' + cfg.zuzycie + ', żeby doraźnie sprawdzić "co jeśli" — to lokalna symulacja, nie zmienia Planu ani nic nie wysyła.' +
      (hasOverrides ? ' <button type="button" class="btn-clearsim" onclick="clearSolderOverrides()">Wyczyść symulację</button>' : '') +
    '<br><span class="cn">点击' + cfg.produkcja + ' / ' + cfg.zuzycie + '列中的数字，即可临时进行"假设"测算 — 这只是本地模拟，不会更改计划或发送任何数据。</span></div>' +
    '<div class="tablewrap"><div class="tablescroll"><table><thead><tr>' +
      '<th>Dzień<span class="cn">日期</span></th><th>' + cfg.produkcja + '</th><th>' + cfg.zuzycie + '</th><th>Bufor<span class="cn">缓冲区</span></th>' +
    '</tr></thead><tbody>' +
      (visible.length ? visible.map(function(r) {
        var dd = r.date.split('-');
        var wd = isoToDate(r.date).getDay();
        var label = DAY_LABELS[(wd + 6) % 7] + ' ' + dd[2] + '/' + dd[1] + (r.isToday ? ' &#183; dziś' : '') +
          (r.date === firstDate ? '' : ' <span class="tag ' + (r.isActual ? 'actual' : 'plan') + '">' + (r.isActual ? 'actual' : 'plan') + '</span>');
        var balCls = r.balance < 0 ? 'neg' : 'ok';
        var prodCell = r.date === firstDate ? fmt(r.produkcja) :
          '<input type="number" class="cellinput' + (r.overrideProd ? ' overridden' : '') + '" data-date="' + r.date + '" data-role="produkcja" value="' + r.produkcja + '">';
        var useCell = r.date === firstDate ? fmt(r.zuzycie) :
          '<input type="number" class="cellinput' + (r.overrideUse ? ' overridden' : '') + '" data-date="' + r.date + '" data-role="zuzycie" value="' + r.zuzycie + '">';
        return '<tr class="' + (r.isToday ? 'today' : '') + (r.balance < 0 ? ' negative' : '') + '"><td>' + label + '</td><td>' + prodCell + '</td><td>' + useCell + '</td><td class="balance ' + balCls + '">' + fmt(r.balance) + '</td></tr>';
      }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--faint)">Ten miesiąc jest przed pierwszą inwentaryzacją bufora &#183; 该月早于第一次盘点</td></tr>') +
    '</tbody></table></div></div>' +
    solderFormHtml() +
    '</div>';
  wireSolderConfig(); wireSolderForm(); wireSolderCells();
}
function setSolderOverride(dateIso, role, valueStr) {
  var v = valueStr === '' ? null : Number(valueStr);
  if (v === null || isNaN(v) || v < 0) {
    if (STATE.solderOverrides[dateIso]) delete STATE.solderOverrides[dateIso][role];
  } else {
    if (!STATE.solderOverrides[dateIso]) STATE.solderOverrides[dateIso] = {};
    STATE.solderOverrides[dateIso][role] = v;
  }
  if (STATE.solderOverrides[dateIso] && !Object.keys(STATE.solderOverrides[dateIso]).length) delete STATE.solderOverrides[dateIso];
  try { localStorage.setItem('cfm_solder_overrides', JSON.stringify(STATE.solderOverrides)); } catch (e) {}
  renderSolderSection(STATE.solderFirstDate);
}
function clearSolderOverrides() {
  STATE.solderOverrides = {};
  try { localStorage.removeItem('cfm_solder_overrides'); } catch (e) {}
  renderSolderSection(STATE.solderFirstDate);
}
function wireSolderCells() {
  document.querySelectorAll('#solderApp .cellinput').forEach(function(el) {
    el.onchange = function() { setSolderOverride(el.dataset.date, el.dataset.role, el.value); };
  });
}

function pinGateConfirm() {
  var p = document.getElementById('pinGateInput').value;
  var sp = localStorage.getItem('cfm_pin') || '1234';
  var err = document.getElementById('pinGateErr');
  if (p !== sp) { err.style.display = 'block'; document.getElementById('pinGateInput').value = ''; return; }
  err.style.display = 'none';
  sessionStorage.setItem('cfm_page_unlocked', '1');
  document.getElementById('pinGateOverlay').classList.add('hidden');
  init();
}

if (sessionStorage.getItem('cfm_page_unlocked') === '1') { init(); }
else { setTimeout(function() { var el = document.getElementById('pinGateInput'); if (el) el.focus(); }, 100); }

function toggleNavMenu() {
  document.getElementById('navmenuDropdown').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  var wrap = document.querySelector('.navmenu-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('navmenuDropdown').classList.remove('open');
});
</script>
