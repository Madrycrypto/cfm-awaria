<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>CFM · Obsada</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Cg fill='%231A6ED8'%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(0 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(120 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(240 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='9' fill='%230d0d0d' stroke='%231A6ED8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#161616;--surface-2:#1c1c1c;--border:#262626;--border-soft:#1e1e1e;
  --text:#f2f2f2;--muted:#9a9a9a;--faint:#5c5c5c;
  --blue:#1A6ED8;--blue-soft:#2f7fe0;--green:#1A9E50;--red:#D92B2B;--orange:#D97706;
  --shift-a:#5AA9FF;--shift-b:#1A6ED8;--shift-c:#0B3D91;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fc:'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:86px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.cn{font-family:var(--fc);color:var(--faint);font-weight:400}
::selection{background:var(--blue);color:#fff}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.topbar-right{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
.topbar-right .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.topbar-right .live.off{color:var(--red)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-pulse{animation:none}}

.pagehead{padding:24px 0 16px}
h1{font-family:var(--fh);font-weight:800;font-size:28px;letter-spacing:0.2px}
h1 .cn{font-family:var(--fc);font-size:15px;font-weight:500;margin-left:8px}
.sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}

.stationgroup{margin-bottom:22px}
.stationgroup-name{font-family:var(--fh);font-weight:800;font-size:16px;margin-bottom:8px}
.shiftcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.shiftcard-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shiftpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:700;font-size:13px}
.shiftpill i{width:8px;height:8px;border-radius:50%}
.crewcount{font-size:11px;color:var(--faint)}
.chiplist{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--fb);font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:20px;padding:7px 13px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip-empty{font-size:12px;color:var(--faint);padding:6px 0}

.crewtags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;min-height:20px}
.crewtag{display:inline-flex;align-items:center;gap:7px;font-family:var(--fb);font-weight:600;font-size:12.5px;color:#fff;background:var(--blue);border-radius:20px;padding:6px 8px 6px 13px}
.crewtag button{background:rgba(255,255,255,0.2);border:none;color:#fff;width:17px;height:17px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.crewtag button:hover{background:rgba(255,255,255,0.35)}
.crewtags-empty{font-size:12px;color:var(--faint);font-style:italic}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addinput{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);font-family:var(--fb);font-size:13px;padding:8px 12px}
.addinput:focus{outline:none;border-color:var(--blue)}
.addbtn{font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;background:var(--green);color:#fff;border:none;border-radius:7px;padding:0 16px;cursor:pointer}
.addbtn:hover{filter:brightness(1.1)}
.quicklbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.quickpick{display:flex;flex-wrap:wrap;gap:6px}
.quickchip{font-family:var(--fb);font-weight:500;font-size:11.5px;color:var(--muted);background:none;border:1px dashed var(--border-soft);border-radius:16px;padding:5px 11px;cursor:pointer}
.quickchip:hover{color:var(--text);border-color:var(--faint)}

.actions{position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--border);margin-top:-1px}
.actions .wrap{display:flex;gap:10px;width:100%;padding:0 20px}
.btn{font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;border:none;border-radius:10px;padding:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn-save{background:var(--blue);color:#fff;flex:1}
.btn-save.pulse{background:var(--orange);animation:savepulse 1.4s ease-in-out infinite}
@keyframes savepulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.btn-save.pulse{animation:none}}
.btn small{display:block;font-family:var(--fc);font-weight:400;text-transform:none;font-size:10.5px;opacity:.75;margin-top:2px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(26,158,80,0.4);color:#3fd17a}
.toast.err{border-color:rgba(217,43,43,0.4);color:#ff7070}

.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.8}
.note{display:flex;gap:12px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.note b{color:var(--text)}
.note .ic{font-family:var(--fh);font-weight:900;font-size:18px;color:var(--blue-soft);flex-shrink:0}

.bulkpanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:22px}
.bulkpanel h3{font-family:var(--fh);font-weight:700;font-size:14px;margin-bottom:4px}
.bulkpanel .bulksub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.bulktextarea{width:100%;min-height:110px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:13px;padding:10px 12px;resize:vertical}
.bulktextarea:focus{outline:none;border-color:var(--blue)}
.bulkrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.bulkbtn{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:0.02em;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer}
.bulkbtn:hover{filter:brightness(1.1)}
.bulkcount{font-size:11.5px;color:var(--faint)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="dot"></span>CFM</div>
    <div class="crumb"><b>Obsada stanowisk <span class="cn">工位人员配置</span></b></div>
    <div class="topbar-right">
      <div class="live" id="liveStatus"><span class="live-pulse"></span>łączenie&#8230; <span class="cn">连接中&#8230;</span></div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
// Domyslny webhook wpisany na sztywno — zeby KAZDY otwierajacy ten link
// mial polaczenie od razu, bez konfigurowania Panelu Admina na tym samym
// urzadzeniu/przegladarce (localStorage jest osobny dla kazdej przegladarki/
// profilu/trybu incognito). Ten sam wzorzec co CFM_R_DZIENNY_V3.html.
var DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw1WjHbfYGIoX6Ik4MLqZpfS8gp1FzHyRLPciOdkSu8vGdJewFtEyC2aKobpLO9m6S7JA/exec';
function getWH() { return localStorage.getItem('cfm_raport_webhook') || DEFAULT_WEBHOOK; }

var STATE = { stations: [], shiftLabels: ['A', 'B', 'C'], workers: [], crew: {}, dirty: false };

function showToast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  setTimeout(function() { t.className = 'toast ' + (kind || ''); }, 2200);
}

function showConnError(msg) {
  var liveEl = document.getElementById('liveStatus');
  liveEl.className = 'live off';
  liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
  document.getElementById('app').innerHTML = '<div class="empty">' + (msg || 'Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span>') + '</div>';
}

function init() {
  var wh = getWH();
  var liveEl = document.getElementById('liveStatus');
  if (!wh) {
    liveEl.className = 'live off';
    liveEl.innerHTML = '<span class="live-pulse"></span>brak połączenia <span class="cn">未连接</span>';
    document.getElementById('app').innerHTML = '<div class="empty">Nie skonfigurowano połączenia na tym urządzeniu.<br><span class="cn">此设备尚未配置连接。</span><br><br>Otwórz główną apkę CFM &#8594; Panel Admina &#8594; Połączenie, skonfiguruj Webhook URL, wróć tutaj i odśwież stronę.<br><span class="cn">打开CFM主应用 &#8594; 管理面板 &#8594; 连接，配置Webhook网址，然后返回此页面刷新。</span></div>';
    return;
  }
  fetch(wh + '?event_type=GET_USTAWIENIA')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'ok') { showConnError(); return; }
      var u = data.ustawienia || {};
      try { STATE.stations = JSON.parse(u.cfm_stations || '[]'); } catch (e) { STATE.stations = []; }
      try {
        var shifts = JSON.parse(u.cfm_shifts || 'null');
        if (shifts && shifts.zmiany && shifts.zmiany.length) STATE.shiftLabels = shifts.zmiany.map(function(z) { return z.label; });
      } catch (e) {}
      try { STATE.workers = JSON.parse(u.cfm_workers || '[]'); } catch (e) { STATE.workers = []; }
      try { STATE.crew = JSON.parse(u.cfm_crew || '{}'); } catch (e) { STATE.crew = {}; }
      if (!STATE.stations.length) { showConnError('Brak skonfigurowanych stanowisk · 未配置工位'); return; }
      liveEl.className = 'live';
      liveEl.innerHTML = '<span class="live-pulse"></span>połączono <span class="cn">已连接</span>';
      render();
    })
    .catch(function() { showConnError(); });
}

// applySaveButtonState maluje przycisk wg AKTUALNEGO STATE.dirty,
// niezaleznie od tego czy sama flaga sie wlasnie zmienila — potrzebne po
// kazdym render() (nowy element #btnSave), zeby "niezapisane zmiany" nie
// znikaly wizualnie tylko dlatego ze flaga byla juz true przed przebudowa DOM.
function applySaveButtonState() {
  var btn = document.getElementById('btnSave');
  if (!btn) return;
  if (STATE.dirty) { btn.classList.add('pulse'); btn.innerHTML = 'Zapisz obsadę &#8212; masz niezapisane zmiany!<small>保存人员配置 &#8212; 有未保存的更改!</small>'; }
  else { btn.classList.remove('pulse'); btn.innerHTML = 'Zapisz obsadę<small>保存人员配置</small>'; }
}
function markDirty() { STATE.dirty = true; applySaveButtonState(); }
function clearDirty() { STATE.dirty = false; applySaveButtonState(); }
window.addEventListener('beforeunload', function(e) {
  if (!STATE.dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

function shiftColor(s) { return s === 'A' ? 'var(--shift-a)' : s === 'B' ? 'var(--shift-b)' : 'var(--shift-c)'; }

function render() {
  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="pagehead"><h1>Obsada stanowisk <span class="cn">工位人员配置</span></h1><div class="sub">Kto pracuje na którym stanowisku, w której zmianie (grupie) &#8212; używane do wyliczenia premii na stronie Premie. Wpisz imię i nazwisko i kliknij "Dodaj", albo wybierz kogoś z szybkiego wyboru poniżej. Kliknij &#215; przy nazwisku, żeby usunąć.<br><span class="cn">谁在哪个工位、哪个班次（组）工作 &#8212; 用于奖金计算。输入姓名并点击"添加"，或从下方快速选择。点击姓名旁的&#215;可删除。</span></div></div>' +
    '<div class="note"><div class="ic">i</div><div><b>Zmiana = tożsamość grupy, nie pora dnia.</b> <span class="cn">班次 = 组的身份，不是时间段。</span><br>Ta lista jest trwała, nie miesięczna &#8212; edytuj ją, gdy skład drużyny się zmienia (ktoś dołącza/odchodzi), nie co miesiąc. Dodane tu osoby nie muszą być na liście "Pracownicy" w głównej apce &#8212; to niezależna lista.<br><span class="cn">此列表是持续性的，不是按月的。在此添加的人员不需要在主应用的"员工"列表中 &#8212; 这是独立的列表。</span></div></div>' +
    '<div class="bulkpanel"><h3>Dodaj pracowników do wspólnej listy <span class="cn">批量添加员工到共享列表</span></h3>' +
      '<div class="bulksub">Wklej listę imion i nazwisk (po jednym w wierszu) i zapisz &#8212; trafią do "Szybki wybór" na każdym stanowisku, żebyś mógł ich sam przypisać poniżej. Zapisuje się od razu do Ustawień na serwerze, więc pojawią się we wszystkich aplikacjach.<br><span class="cn">粘贴姓名列表（每行一个）并保存 &#8212; 会出现在每个工位的"快速选择"中。立即保存到服务器设置，所有设备都能看到。</span></div>' +
      '<textarea class="bulktextarea" id="bulkTextarea" placeholder="Jan Kowalski&#10;Anna Nowak&#10;..."></textarea>' +
      '<div class="bulkrow"><span class="bulkcount" id="bulkCount"></span><button type="button" class="bulkbtn" id="btnBulkAdd">Dodaj do wspólnej listy<small style="display:block;font-family:var(--fc);font-weight:400;font-size:10px">添加到共享列表</small></button></div>' +
      '<div class="quicklbl" style="margin-top:14px">Aktualna wspólna lista &#8212; kliknij &#215; żeby usunąć na stałe &#183; 当前共享列表 &#8212; 点击&#215;永久删除</div>' +
      '<div class="crewtags" id="workersList">' + workersListHtml() + '</div>' +
    '</div>' +
    '<div id="stationlist"></div>' +
    '<div class="actions"><div class="wrap"><button class="btn btn-save" id="btnSave">Zapisz obsadę<small>保存人员配置</small></button></div></div>';

  var html = '';
  STATE.stations.forEach(function(st) {
    var stCrew = STATE.crew[st] || {};
    html += '<div class="stationgroup"><div class="stationgroup-name">' + st + '</div>';
    STATE.shiftLabels.forEach(function(sh) {
      var crewList = stCrew[sh] || [];
      var quickOptions = STATE.workers.filter(function(w) { return crewList.indexOf(w) < 0; });
      html += '<div class="shiftcard" data-station="' + st.replace(/"/g, '&quot;') + '" data-shift="' + sh + '">' +
        '<div class="shiftcard-head"><span class="shiftpill"><i style="background:' + shiftColor(sh) + '"></i>Zmiana ' + sh + '</span><span class="crewcount">' + crewList.length + ' os.</span></div>' +
        '<div class="crewtags">' + crewTagsHtml(crewList) + '</div>' +
        '<div class="addrow"><input type="text" class="addinput" placeholder="Imię i nazwisko&#8230; · 姓名&#8230;"><button type="button" class="addbtn">Dodaj<small style="display:block;font-family:var(--fc);font-weight:400;font-size:9px">添加</small></button></div>' +
        (quickOptions.length ? '<div class="quicklbl">Szybki wybór &#183; 快速选择</div><div class="quickpick">' + quickOptions.map(function(w) {
          return '<button type="button" class="quickchip" data-worker="' + w.replace(/"/g, '&quot;') + '">+ ' + w + '</button>';
        }).join('') + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
  });
  document.getElementById('stationlist').innerHTML = html || '<div class="empty">Brak stanowisk. <span class="cn">无工位。</span></div>';

  document.getElementById('stationlist').addEventListener('click', function(e) {
    var removeBtn = e.target.closest('.crewtag button');
    if (removeBtn) {
      var cardForRemoval = removeBtn.closest('.shiftcard');
      removeBtn.closest('.crewtag').remove();
      refreshCrewCount(cardForRemoval);
      markDirty();
      return;
    }
    var quickChip = e.target.closest('.quickchip');
    if (quickChip) { addNameToCard(quickChip.closest('.shiftcard'), quickChip.dataset.worker); quickChip.remove(); return; }
    var addBtn = e.target.closest('.addbtn');
    if (addBtn) { submitAddInput(addBtn.closest('.shiftcard')); return; }
  });
  document.getElementById('stationlist').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var input = e.target.closest('.addinput');
    if (!input) return;
    e.preventDefault();
    submitAddInput(input.closest('.shiftcard'));
  });

  document.getElementById('btnSave').onclick = savePlan;
  applySaveButtonState();

  var bulkTextarea = document.getElementById('bulkTextarea');
  bulkTextarea.addEventListener('input', updateBulkCount);
  document.getElementById('btnBulkAdd').onclick = bulkAddWorkers;

  document.getElementById('workersList').addEventListener('click', function(e) {
    var removeBtn = e.target.closest('.crewtag button');
    if (!removeBtn) return;
    removeWorkerGlobally(removeBtn.closest('.crewtag').dataset.name);
  });
}

function workersListHtml() {
  if (!STATE.workers.length) return '<span class="crewtags-empty">brak pracowników na wspólnej liście &#183; 共享列表为空</span>';
  return STATE.workers.map(function(n) {
    return '<span class="crewtag" data-name="' + n.replace(/"/g, '&quot;') + '">' + n + '<button type="button" title="Usuń na stałe">&#10005;</button></span>';
  }).join('');
}

// Usuwa pracownika CALKOWICIE ze wspolnej listy (nie tylko z jednej
// obsady) — zapisuje sie od razu na serwer. Ktokolwiek juz go ma
// przypisanego w jakiejs obsadzie stanowiska, zachowuje ten wpis (obsada
// trzyma nazwiska jako zwykly tekst, niezalezny od tej listy) — po prostu
// nie bedzie go juz w "Szybki wybor" przy dodawaniu nowych przypisan.
function removeWorkerGlobally(name) {
  STATE.workers = STATE.workers.filter(function(w) { return w !== name; });
  localStorage.setItem('cfm_workers', JSON.stringify(STATE.workers));
  var wh = getWH();
  fetch(wh, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_workers', wartosc: JSON.stringify(STATE.workers) })
  }).then(function() {
    showToast('Usunięto ze wspólnej listy · 已从共享列表删除', 'ok');
    rerenderKeepingCrew();
  }).catch(function() {
    showToast('Usunięto lokalnie, błąd wysyłki · 已本地删除，发送失败', 'err');
    rerenderKeepingCrew();
  });
}

function parseBulkNames() {
  var raw = document.getElementById('bulkTextarea').value;
  return raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
}

function updateBulkCount() {
  var names = parseBulkNames();
  var nowe = names.filter(function(n) { return STATE.workers.indexOf(n) < 0; });
  var el = document.getElementById('bulkCount');
  if (!names.length) { el.textContent = ''; return; }
  el.textContent = nowe.length + ' nowych, ' + (names.length - nowe.length) + ' już na liście &#183; ' + nowe.length + ' 新, ' + (names.length - nowe.length) + ' 已存在';
  el.innerHTML = el.textContent;
}

// Dopisuje pracownikow do WSPOLNEJ listy cfm_workers (ta sama, ktora
// zasila "Pracownicy" w Panel Admina glownej apki i operatorow w
// raportach) — nie do konkretnej obsady stanowiska. Zapisuje sie od razu
// na serwer (nie czeka na "Zapisz obsade"), zeby bylo widac natychmiast we
// wszystkich aplikacjach, a nie tylko po zapisaniu calego formularza.
// Odswiezanie widoku (nowe pozycje w "Szybki wybor") NIE moze zgubic
// jeszcze niezapisanych zaznaczen w kartach obsady — najpierw zbieramy
// aktualny stan z DOM z powrotem do STATE.crew, dopiero potem re-renderujemy.
function rerenderKeepingCrew() {
  STATE.crew = collectCrewFromUI();
  render();
}

function bulkAddWorkers() {
  var names = parseBulkNames();
  if (!names.length) { showToast('Wklej najpierw listę nazwisk · 请先粘贴姓名列表', 'err'); return; }
  var added = 0;
  names.forEach(function(n) {
    if (STATE.workers.indexOf(n) < 0) { STATE.workers.push(n); added++; }
  });
  localStorage.setItem('cfm_workers', JSON.stringify(STATE.workers));
  var wh = getWH();
  fetch(wh, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_workers', wartosc: JSON.stringify(STATE.workers) })
  }).then(function() {
    showToast(added + ' pracowników dodanych do wspólnej listy! · 已添加 ' + added + ' 名员工!', 'ok');
    rerenderKeepingCrew();
  }).catch(function() {
    showToast('Zapisano lokalnie, błąd wysyłki · 已本地保存，发送失败', 'err');
    rerenderKeepingCrew();
  });
}

function crewTagsHtml(names) {
  if (!names.length) return '<span class="crewtags-empty">brak obsady &#183; 无人员</span>';
  return names.map(function(n) {
    return '<span class="crewtag" data-name="' + n.replace(/"/g, '&quot;') + '">' + n + '<button type="button" title="Usuń">&#10005;</button></span>';
  }).join('');
}

function refreshCrewCount(card) {
  var tags = card.querySelectorAll('.crewtag');
  card.querySelector('.crewcount').textContent = tags.length + ' os.';
  if (!tags.length) card.querySelector('.crewtags').innerHTML = '<span class="crewtags-empty">brak obsady &#183; 无人员</span>';
}

function addNameToCard(card, name) {
  name = (name || '').trim();
  if (!name) return;
  var existing = Array.prototype.map.call(card.querySelectorAll('.crewtag'), function(t) { return t.dataset.name; });
  if (existing.indexOf(name) >= 0) { showToast('Ta osoba jest już na liście · 此人已在名单中', 'err'); return; }
  var tagsEl = card.querySelector('.crewtags');
  var emptyEl = tagsEl.querySelector('.crewtags-empty');
  if (emptyEl) emptyEl.remove();
  var span = document.createElement('span');
  span.className = 'crewtag';
  span.dataset.name = name;
  span.innerHTML = name.replace(/</g, '&lt;') + '<button type="button" title="Usuń">&#10005;</button>';
  tagsEl.appendChild(span);
  refreshCrewCount(card);
  markDirty();
}

function submitAddInput(card) {
  var input = card.querySelector('.addinput');
  addNameToCard(card, input.value);
  input.value = '';
  input.focus();
}

function collectCrewFromUI() {
  var crew = {};
  document.querySelectorAll('.shiftcard').forEach(function(card) {
    var st = card.dataset.station, sh = card.dataset.shift;
    var names = Array.prototype.map.call(card.querySelectorAll('.crewtag'), function(t) { return t.dataset.name; });
    if (!names.length) return;
    if (!crew[st]) crew[st] = {};
    crew[st][sh] = names;
  });
  return crew;
}

function savePlan() {
  STATE.crew = collectCrewFromUI();
  localStorage.setItem('cfm_crew', JSON.stringify(STATE.crew));
  clearDirty();

  var wh = getWH();
  fetch(wh, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_crew', wartosc: JSON.stringify(STATE.crew) })
  }).then(function() {
    showToast('Obsada zapisana! · 人员配置已保存!', 'ok');
  }).catch(function() {
    showToast('Zapisano lokalnie, błąd wysyłki · 已本地保存，发送失败', 'err');
  });
}

init();
</script>

</html>
