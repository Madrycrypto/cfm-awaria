<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>CFM · Plan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Cg fill='%231A6ED8'%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(0 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(120 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(240 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='9' fill='%230d0d0d' stroke='%231A6ED8' stroke-width='3'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#161616;--surface-2:#1c1c1c;--border:#262626;--border-soft:#1e1e1e;
  --text:#f2f2f2;--muted:#9a9a9a;--faint:#5c5c5c;
  --blue:#1A6ED8;--blue-soft:#2f7fe0;--green:#1A9E50;--red:#D92B2B;--orange:#D97706;
  --shift-a:#5AA9FF;--shift-b:#1A6ED8;--shift-c:#0B3D91;
  --sunday-bg:#141414;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fc:'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:86px}
.wrap{max-width:1700px;margin:0 auto;padding:0 24px}
.cn{font-family:var(--fc);color:var(--faint);font-weight:400}
::selection{background:var(--blue);color:#fff}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1700px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.navlinks{display:flex;gap:4px;flex-wrap:wrap}
.navlinks a{font-family:var(--fh);font-weight:700;font-size:12.5px;letter-spacing:0.02em;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:7px;white-space:nowrap}
.navlinks a:hover{color:var(--text);background:var(--surface-2)}
.navlinks a.on{color:#fff;background:var(--blue)}
.topbar-right{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
.topbar-right .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.topbar-right .live.off{color:var(--red)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-pulse{animation:none}}

.pagehead{padding:24px 0 16px}
h1{font-family:var(--fh);font-weight:800;font-size:28px;letter-spacing:0.2px}
h1 .cn{font-family:var(--fc);font-size:15px;font-weight:500;margin-left:8px}
.sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}

.monthnav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;max-width:280px}
.monthnav button{background:none;border:none;color:var(--muted);font-size:20px;padding:8px 16px;cursor:pointer;border-radius:8px}
.monthnav button:hover{color:var(--text);background:var(--surface-2)}
.monthnav .mlabel{flex:1;text-align:center;font-family:var(--fh);font-weight:800;font-size:16px;letter-spacing:0.3px}
.monthnav .mlabel .cn{font-size:11px;margin-left:5px}

.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;border-radius:3px;display:inline-block}

.stationgroup{margin-bottom:22px}
.stationgroup-name{font-family:var(--fh);font-weight:800;font-size:16px;margin-bottom:8px}
.shiftcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.shiftcard-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shiftpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:700;font-size:13px;flex-shrink:0}
.shiftpill i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.quickval{width:92px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);font-family:var(--fh);font-weight:700;font-size:14px;text-align:center;padding:8px 6px;font-variant-numeric:tabular-nums}
.quickval:focus{outline:none;border-color:var(--blue)}
.quickval::placeholder{color:var(--faint);font-weight:500}
.btn-mini{font-family:var(--fh);font-weight:700;font-size:10.5px;letter-spacing:0.03em;text-transform:uppercase;border-radius:7px;padding:8px 12px;cursor:pointer;border:1px solid var(--border);background:none}
.btn-mini.copy{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-mini.clear{background:none;color:var(--red);border-color:rgba(217,43,43,0.4)}
.btn-mini.clear:hover{background:rgba(217,43,43,0.12)}
.btn-mini.toggle{background:var(--surface-2);color:var(--muted);margin-left:auto}
.btn-mini.toggle:hover{color:var(--text)}
.btn-mini.toggle.open{color:var(--blue-soft);border-color:var(--blue-soft)}
.btn-mini small{display:block;font-family:var(--fc);font-weight:400;text-transform:none;font-size:9px;opacity:.7;margin-top:1px}
.irregular-flag{font-size:10px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:0.03em}

.daystrip{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)}
.daycell{flex:1 1 0;min-width:50px;text-align:center}
.daycell .dlabel{font-size:9px;color:var(--faint);margin-bottom:3px;font-weight:600}
.daycell.sun .dlabel{color:var(--red)}
.daycell input{width:100%;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:5px;color:var(--text);font-family:var(--fh);font-weight:700;font-size:11px;text-align:center;padding:5px 1px;font-variant-numeric:tabular-nums}
.daycell input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.daycell input::placeholder{color:var(--faint);font-weight:500}
.daycell.sun input{opacity:.4}

.actions{position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--border);margin-top:-1px}
.actions .wrap{display:flex;gap:10px;width:100%;padding:0 20px}
.btn{font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;border:none;border-radius:10px;padding:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn-copy{background:var(--surface-2);color:var(--text);border:1px solid var(--border);flex:1}
.btn-save{background:var(--blue);color:#fff;flex:2}
.btn-save.pulse{background:var(--orange, #D97706);animation:savepulse 1.4s ease-in-out infinite}
@keyframes savepulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.btn-save.pulse{animation:none}}
.btn small{display:block;font-family:var(--fc);font-weight:400;text-transform:none;font-size:10.5px;opacity:.75;margin-top:2px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(26,158,80,0.4);color:#3fd17a}
.toast.err{border-color:rgba(217,43,43,0.4);color:#ff7070}

.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.8}
.automirror{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.6}
.automirror b{color:var(--text)}

.excelimport{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.excelimport-hint{font-size:11.5px;color:var(--faint);line-height:1.5;max-width:520px}
.diffpanel{background:var(--surface);border:1px solid var(--blue);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.diffpanel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.diffpanel-head h3{font-family:var(--fh);font-weight:800;font-size:15px}
.diffpanel-head h3 .cn{font-family:var(--fc);font-size:12px;font-weight:500;margin-left:6px;color:var(--faint)}
.diffpanel-summary{font-size:12.5px;color:var(--muted)}
.difftable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;max-height:320px;overflow-y:auto;display:block}
.difftable th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.difftable td{padding:5px 8px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
.difftable tr.new td{color:#3fd17a}
.difftable tr.changed td{color:#f0a030}
.diffpanel-actions{display:flex;gap:10px;margin-top:12px}
.btn-diff{font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;border-radius:8px;padding:9px 16px;cursor:pointer;border:none}
.btn-diff.approve{background:var(--green);color:#fff}
.btn-diff.cancel{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}

.gridwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:18px}
.gridtable{border-collapse:collapse;font-size:10.5px;width:100%}
.gridtable tbody td.adjacent,.gridtable thead th.adjacent{opacity:.4}
.gridtable thead th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-family:var(--fh);font-weight:700;padding:5px 3px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border-soft);min-width:26px}
.gridtable thead th.lbl{position:sticky;left:0;z-index:2;background:var(--surface-2);min-width:100px;text-align:left;padding-left:8px}
.gridtable thead th.we{color:var(--faint)}
.gridtable thead th.sum{min-width:56px}
.gridtable tbody td{padding:4px 2px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border-soft);font-variant-numeric:tabular-nums;color:var(--text)}
.gridtable tbody td.lbl{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:8px;font-family:var(--fh);font-weight:700;white-space:nowrap;border-right:1px solid var(--border-soft)}
.gridtable tbody td.lbl .sh{display:inline-flex;align-items:center;gap:4px;font-size:10.5px}
.gridtable tbody td.lbl .sh i{width:6px;height:6px;border-radius:50%;display:inline-block}
.gridtable tbody td.we{background:rgba(255,255,255,0.02)}
.gridtable tbody td.empty{color:var(--faint)}
.gridtable tbody td.sum{font-weight:800;background:var(--surface-2)}
.gridtable tbody td.anom{background:rgba(217,43,43,0.22);box-shadow:inset 0 0 0 1px var(--red);color:#fff;font-weight:800}
.gridtable tbody tr:last-child td{border-bottom:none}
.gridtable tbody tr.stgap td{border-bottom:6px solid var(--bg)}
.gridlegend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:8px}
.gridlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>

<div class="topbar">
  <div class="topbar-inner">

    <div class="navlinks">

    </div>
    <div class="topbar-right">
      <div class="live" id="liveStatus"><span class="live-pulse"></span>łączenie&#8230; <span class="cn">连接中&#8230;</span></div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Domyslny webhook wpisany na sztywno — zeby KAZDY otwierajacy ten link
// mial polaczenie od razu, bez konfigurowania Panelu Admina na tym samym
// urzadzeniu/przegladarce (localStorage jest osobny dla kazdej przegladarki/
// profilu/trybu incognito). Ten sam wzorzec co CFM_R_DZIENNY_V3.html.
var DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbw1WjHbfYGIoX6Ik4MLqZpfS8gp1FzHyRLPciOdkSu8vGdJewFtEyC2aKobpLO9m6S7JA/exec';
function getWH() { return localStorage.getItem('cfm_raport_webhook') || DEFAULT_WEBHOOK; }
var MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
var MONTH_NAMES_CN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var WD = ['pn','wt','śr','cz','pt','so','nd'];

var STATE = {
  viewMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  stations: [], shiftLabels: ['A', 'B', 'C'], targets: {}, plan: {},
  shippingPlan: {}, shippingActual: {}, dirty: false
};

// applySaveButtonState maluje przycisk wg AKTUALNEGO STATE.dirty,
// niezaleznie od tego czy sama flaga sie wlasnie zmienila — potrzebne po
// kazdym render() (nowy element #btnSave), zeby "niezapisane zmiany" nie
// znikaly wizualnie tylko dlatego ze flaga byla juz true przed przebudowa DOM.
function applySaveButtonState() {
  var btn = document.getElementById('btnSave');
  if (!btn) return;
  if (STATE.dirty) { btn.classList.add('pulse'); btn.innerHTML = 'Zapisz plan &#8212; masz niezapisane zmiany!<small>保存计划 &#8212; 有未保存的更改!</small>'; }
  else { btn.classList.remove('pulse'); btn.innerHTML = 'Zapisz plan<small>保存计划</small>'; }
}
function markDirty() { STATE.dirty = true; applySaveButtonState(); }
function clearDirty() {
  STATE.dirty = false;
  applySaveButtonState();
}
window.addEventListener('beforeunload', function(e) {
  if (!STATE.dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

function pad(n) { return String(n).padStart(2, '0'); }
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function dateISO(y, m, day) { return y + '-' + pad(m + 1) + '-' + pad(day); }
function daysInMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function shiftColor(s) { return s === 'A' ? 'var(--shift-a)' : s === 'B' ? 'var(--shift-b)' : 'var(--shift-c)'; }

function showToast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  setTimeout(function() { t.className = 'toast ' + (kind || ''); }, 2200);
}

function init() {
  var wh = getWH();
  var liveEl = document.getElementById('liveStatus');
  if (!wh) {
    liveEl.className = 'live off';
    liveEl.innerHTML = '<span class="live-pulse"></span>brak połączenia <span class="cn">未连接</span>';
    document.getElementById('app').innerHTML = '<div class="empty">Nie skonfigurowano połączenia na tym urządzeniu.<br><span class="cn">此设备尚未配置连接。</span><br><br>Otwórz główną apkę CFM &#8594; Panel Admina &#8594; Połączenie, skonfiguruj Webhook URL, wróć tutaj i odśwież stronę.<br><span class="cn">打开CFM主应用 &#8594; 管理面板 &#8594; 连接，配置Webhook网址，然后返回此页面刷新。</span></div>';
    return;
  }
  fetch(wh + '?event_type=GET_USTAWIENIA')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'ok') { showConnError(); return; }
      var u = data.ustawienia || {};
      try { STATE.stations = JSON.parse(u.cfm_stations || '[]'); } catch (e) { STATE.stations = []; }
      try {
        var shifts = JSON.parse(u.cfm_shifts || 'null');
        if (shifts && shifts.zmiany && shifts.zmiany.length) STATE.shiftLabels = shifts.zmiany.map(function(z) { return z.label; });
      } catch (e) {}
      try { STATE.targets = JSON.parse(u.cfm_station_targets || '{}'); } catch (e) { STATE.targets = {}; }
      try { STATE.plan = JSON.parse(u.cfm_monthly_plan || '{}'); } catch (e) { STATE.plan = {}; }
      try { STATE.shippingPlan = JSON.parse(u.cfm_shipping_plan || '{}'); } catch (e) { STATE.shippingPlan = {}; }
      try { STATE.shippingActual = JSON.parse(u.cfm_shipping_actual || '{}'); } catch (e) { STATE.shippingActual = {}; }
      if (!STATE.stations.length) { showConnError('Brak skonfigurowanych stanowisk · 未配置工位'); return; }
      liveEl.className = 'live';
      liveEl.innerHTML = '<span class="live-pulse"></span>połączono <span class="cn">已连接</span>';
      render();
    })
    .catch(function() { showConnError(); });
}

function showConnError(msg) {
  var liveEl = document.getElementById('liveStatus');
  liveEl.className = 'live off';
  liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
  document.getElementById('app').innerHTML = '<div class="empty">' + (msg || 'Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span>') + '</div>';
}

// Sprawdza czy zmiana ma jednolita wartosc na wszystkie dni robocze
// (pon-pt) w tym miesiacu — jesli tak, karta zostaje zwinieta i pokazuje
// tylko "cel dzienny" + przycisk kopiuj. Jesli wartosci sie roznia
// (harmonogram nieregularny, np. lutowanie w piecu co 2 dni), karta
// rozwija sie automatycznie, zeby od razu bylo widac ktore dni sa
// wypelnione.
function analyzeShift(shEntry, y, m, nDays) {
  var weekdayVals = [], filledCount = 0, hasSaturday = false, totalWeekdays = 0;
  for (var d = 1; d <= nDays; d++) {
    var iso = dateISO(y, m, d);
    var wd = new Date(y, m, d).getDay();
    if (wd !== 0 && wd !== 6) totalWeekdays++;
    var val = shEntry[iso];
    if (val === undefined) continue;
    filledCount++;
    if (wd === 6) hasSaturday = true;
    else if (wd !== 0) weekdayVals.push(val);
  }
  // "Jednolite" = pokrywa WSZYSTKIE dni robocze tego miesiaca, nie tylko
  // "te wypelnione wartosci sa takie same" — inaczej rzadki wzorzec (np.
  // co 2 dni, zawsze ta sama ilosc) bylby mylnie traktowany jako prosty
  // "codzienny cel" zamiast nieregularnego harmonogramu.
  var uniform = weekdayVals.length === totalWeekdays && weekdayVals.every(function(v) { return v === weekdayVals[0]; });
  return { filledCount: filledCount, uniform: uniform, quickVal: uniform ? weekdayVals[0] : '', hasSaturday: hasSaturday };
}

function render() {
  var y = STATE.viewMonth.getFullYear(), m = STATE.viewMonth.getMonth();
  var nDays = daysInMonth(STATE.viewMonth);
  var mk = monthKey(STATE.viewMonth);
  var entry = STATE.plan[mk] || {};

  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="pagehead"><h1>Plan produkcji <span class="cn">生产计划</span></h1><div class="sub">Dla stanowisk pracujących codziennie: wpisz jedną liczbę i kliknij "Kopiuj pon–pt". Dla nieregularnych (np. lutowanie w piecu): rozwiń "Dni" i wypełnij ręcznie tylko potrzebne dni.<br><span class="cn">对于每天生产的工位：输入一个数字并点击"复制周一至周五"。对于不规律的工位（如炉内钎焊）：展开"天数"，只需手动填写需要的日期。</span></div></div>' +
    '<div class="monthnav"><button id="prevMonth">&#8249;</button><div class="mlabel">' + MONTH_NAMES[m] + ' ' + y + '<span class="cn">' + MONTH_NAMES_CN[m] + '</span></div><button id="nextMonth">&#8250;</button></div>' +
    '<div class="legend"><span><i style="background:var(--sunday-bg);border:1px solid var(--border)"></i>Niedziela · <span class="cn">周日</span></span><span>"Kopiuj pon–pt" nigdy nie rusza soboty — wpisz ją ręcznie w rozwiniętych dniach, jeśli akurat pracujecie &#183; <span class="cn">"复制"不会填写周六 — 如有加班请在展开的天数中手动填写</span></span></div>' +
    '<div id="shippingSectionTop"></div>' +
    '<div class="gridlegend"><span><i style="background:rgba(217,43,43,0.4);box-shadow:inset 0 0 0 1px var(--red)"></i>wartość odstająca od reszty wiersza &#183; <span class="cn">与该行其他数值不同</span></span></div>' +
    '<div class="gridwrap"><table class="gridtable" id="planGrid"></table></div>' +
    '<div id="planlist"></div>' +
    '<div class="actions"><div class="wrap">' +
      '<button class="btn btn-copy" id="btnCopy">Skopiuj z poprz. mies.<small>从上月复制</small></button>' +
      '<button class="btn btn-save" id="btnSave">Zapisz plan<small>保存计划</small></button>' +
    '</div></div>';

  var html = '';
  STATE.stations.forEach(function(st) {
    if (st === 'OP40 OUT') {
      html += '<div class="stationgroup"><div class="stationgroup-name">' + st + '</div>' +
        '<div class="automirror">Cel zawsze taki sam jak <b>OP40 IN</b> — to co wejdzie do pieca, tyle musi z niego wyjść, więc nie trzeba tego planować osobno.<br><span class="cn">目标始终与OP40 IN相同——进炉多少，出炉就是多少，因此无需单独计划。</span></div></div>';
      return;
    }
    var stEntry = entry[st] || {};
    html += '<div class="stationgroup"><div class="stationgroup-name">' + st + '</div>';
    STATE.shiftLabels.forEach(function(sh) {
      var shEntry = stEntry[sh] || {};
      var info = analyzeShift(shEntry, y, m, nDays);
      var expand = info.filledCount > 0 && !info.uniform;

      var dayCells = '';
      for (var d = 1; d <= nDays; d++) {
        var iso = dateISO(y, m, d);
        var wd = new Date(y, m, d).getDay();
        var isSun = wd === 0;
        var isSat = wd === 6;
        var val = shEntry[iso] !== undefined ? shEntry[iso] : '';
        dayCells += '<div class="daycell' + (isSun ? ' sun' : '') + '"><div class="dlabel">' + d + ' ' + WD[(wd + 6) % 7] + '</div><input type="number" min="0" placeholder="' + (isSat ? '' : (STATE.targets[st] || '')) + '" value="' + val + '" data-station="' + st.replace(/"/g, '&quot;') + '" data-shift="' + sh + '" data-date="' + iso + '"></div>';
      }

      html += '<div class="shiftcard" data-station="' + st.replace(/"/g, '&quot;') + '" data-shift="' + sh + '">' +
        '<div class="shiftcard-head">' +
          '<span class="shiftpill"><i style="background:' + shiftColor(sh) + '"></i>Zmiana ' + sh + '</span>' +
          '<input type="number" min="0" class="quickval" placeholder="np. ' + (STATE.targets[st] || '0') + '" value="' + info.quickVal + '">' +
          '<button type="button" class="btn-mini copy" onclick="quickCopy(this)">Kopiuj pon&#8211;pt<small>复制周一至周五</small></button>' +
          '<button type="button" class="btn-mini clear" onclick="clearShiftDays(this)">Wyczyść dni<small>清空天数</small></button>' +
          (info.hasSaturday ? '<span class="irregular-flag">+ sobota</span>' : '') +
          (expand ? '<span class="irregular-flag">nieregularne</span>' : '') +
          '<button type="button" class="btn-mini toggle' + (expand ? ' open' : '') + '" onclick="toggleDays(this)">Dni ' + (expand ? '&#9652;' : '&#9662;') + ' <span class="cn">天数</span> (' + info.filledCount + ')</button>' +
        '</div>' +
        '<div class="daystrip" style="display:' + (expand ? 'flex' : 'none') + ';">' + dayCells + '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  // Wysylki — osobna, plaska sekcja (bez podzialu na stanowisko/zmiane):
  // Plan (co klient zamowil, wpisywane z wyprzedzeniem, edytowalne kiedy
  // klient zmieni forecast) i Wyslano (co faktycznie wyjechalo) — dokladnie
  // ten sam wzorzec "wpisz i zapisz" co reszta Planu, zeby nie trzeba bylo
  // recznie sledzic "kiedy zaktualizowalem forecast" (edycja jest zawsze
  // na biezaco/na zywo).
  document.getElementById('shippingSectionTop').innerHTML =
    '<div class="stationgroup"><div class="stationgroup-name">Wysyłki <span class="cn">发运</span></div>' +
    '<div class="excelimport">' +
      '<label class="btn-mini copy" style="display:inline-flex;align-items:center;cursor:pointer">Wgraj Excel od klienta<small>上传客户Excel文件</small><input type="file" id="shipExcelInput" accept=".xlsx,.xls" style="display:none"></label>' +
      '<span class="excelimport-hint">Wczytam plik, porównam z aktualnym planem wysyłek i pokażę różnice do zatwierdzenia — nic nie zapisze się automatycznie.<span class="cn">读取文件后与当前发运计划比较，显示差异供确认 — 不会自动保存。</span></span>' +
    '</div>' +
    '<div id="shipDiffPanel"></div>' +
    renderShippingRow('plan', 'Plan wysyłek', '发运计划', y, m, nDays, STATE.shippingPlan[mk] || {}) +
    renderShippingRow('actual', 'Wysłano (faktycznie)', '实际发货数量', y, m, nDays, STATE.shippingActual[mk] || {}) +
    '</div>';

  document.getElementById('planlist').innerHTML = html || '<div class="empty">Brak stanowisk. <span class="cn">无工位。</span></div>';
  document.getElementById('planlist').addEventListener('input', function(e) {
    if (e.target && e.target.matches('.daystrip input')) { markDirty(); refreshPlanGrid(); }
  });
  // Wysylki zyja teraz w osobnym kontenerze nad tabela planu (nie w
  // #planlist), wiec potrzebuja wlasnego nasluchu — nie wplywaja na
  // #planGrid (to tylko produkcja), wystarczy markDirty().
  document.getElementById('shippingSectionTop').addEventListener('input', function(e) {
    if (e.target && e.target.matches('.daystrip input')) markDirty();
  });
  applySaveButtonState(); // odtworz wizualny stan przycisku po re-renderze (np. po kopiowaniu)

  // Zmiana miesiaca NIE wysyla nic na serwer — ale zeby recznie wpisane
  // (jeszcze niezapisane) wartosci dla aktualnie ogladanego miesiaca nie
  // zniknely po prostu przez przejscie na inny miesiac, zbieramy je do
  // STATE.plan PRZED przelaczeniem widoku. To NIE zastepuje "Zapisz plan"
  // (na serwer nadal trzeba wyslac recznie) — chroni tylko przed utrata
  // danych w ramach tej samej sesji w przegladarce.
  function stashCurrentMonthInputs() {
    var curMk = monthKey(STATE.viewMonth);
    STATE.plan[curMk] = collectPlanFromInputs();
    STATE.shippingPlan[curMk] = collectShippingFromInputs('plan');
    STATE.shippingActual[curMk] = collectShippingFromInputs('actual');
  }
  document.getElementById('prevMonth').onclick = function() { stashCurrentMonthInputs(); STATE.viewMonth = new Date(STATE.viewMonth.getFullYear(), STATE.viewMonth.getMonth() - 1, 1); render(); };
  document.getElementById('nextMonth').onclick = function() { stashCurrentMonthInputs(); STATE.viewMonth = new Date(STATE.viewMonth.getFullYear(), STATE.viewMonth.getMonth() + 1, 1); render(); };
  document.getElementById('btnCopy').onclick = copyFromPrevMonth;
  document.getElementById('btnSave').onclick = savePlan;
  var shipInput = document.getElementById('shipExcelInput');
  if (shipInput) shipInput.onchange = function(e) { if (e.target.files[0]) handleShipExcelFile(e.target.files[0]); e.target.value = ''; };

  renderPlanGrid(y, m, nDays, entry);
}

// Siatka dzien-po-dzien na jednym ekranie (podglad, bez edycji — edycja
// zostaje w kartach ponizej) — zeby powtarzalnosc i ewentualne bledy (np.
// pojedynczy dzien z inna wartoscia niz reszta miesiaca) rzucaly sie w
// oczy tak jak w arkuszu kalkulacyjnym, zamiast trzeba bylo przewijac
// karty stanowisko-po-stanowisku i pamietac poprzednie wartosci.
var WD_SHORT = ['P', 'W', 'Ś', 'C', 'P', 'S', 'N'];
function detectRowAnomalies(vals) {
  // vals: tablica liczb (tylko wypelnione dni, bez null). Odstajaca
  // wartosc = mniejszosc wyraznie odstajaca od dominujacej wiekszosci —
  // NIE oznaczamy niczego przy prawdziwie nieregularnym harmonogramie
  // (np. na przemian 255/370), gdzie nie ma jednej dominujacej wartosci.
  if (vals.length < 4) return {};
  var counts = {};
  vals.forEach(function(v) { counts[v] = (counts[v] || 0) + 1; });
  var mode = null, modeCount = 0;
  Object.keys(counts).forEach(function(k) { if (counts[k] > modeCount) { modeCount = counts[k]; mode = k; } });
  if (modeCount / vals.length < 0.6) return {};
  var anomSet = {};
  Object.keys(counts).forEach(function(k) { if (k !== mode) anomSet[k] = true; });
  return anomSet;
}
// Siatka pokazuje PELNE tygodnie (pon-nd), wlacznie z koncowka poprzedniego
// i poczatkiem nastepnego miesiaca, jesli 1. lub ostatni dzien miesiaca nie
// wypada akurat w poniedzialek/niedziele — tak samo jak tydzien w
// Statystykach, zeby nie urywac ostatniego/pierwszego tygodnia w polowie.
// Dni spoza biezacego miesiaca sa wizualnie przygaszone (.adjacent) i NIE
// wliczaja sie do kolumny Suma (ta zawsze liczy tylko dni "tego" miesiaca).
// Wartosci dla dni spoza miesiaca biezemy wprost z STATE.plan (juz
// zaladowanego w calosci przy starcie), bo "entry" to tylko biezacy,
// aktualnie edytowany miesiac.
function mondayOf(d) { var x = new Date(d); var day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return x; }
function planValueForIso(station, shift, iso, currentMk, entry) {
  var mk = iso.slice(0, 7);
  var monthObj = mk === currentMk ? entry : STATE.plan[mk];
  var e = monthObj && monthObj[station] && monthObj[station][shift];
  return e ? e[iso] : undefined;
}
function renderPlanGrid(y, m, nDays, entry) {
  var table = document.getElementById('planGrid');
  if (!table) return;
  var currentMk = y + '-' + pad(m + 1);
  var monthStartIso = dateISO(y, m, 1);
  var monthEndIso = dateISO(y, m, nDays);
  var gridStart = mondayOf(new Date(y, m, 1));
  var gridEnd = mondayOf(new Date(y, m, nDays));
  gridEnd.setDate(gridEnd.getDate() + 6);
  var days = [];
  var cursor = new Date(gridStart);
  while (cursor <= gridEnd) { days.push(isoFromDateObj(cursor)); cursor.setDate(cursor.getDate() + 1); }

  var rows = [];
  STATE.stations.forEach(function(st) {
    if (st === 'OP40 OUT') return;
    STATE.shiftLabels.forEach(function(sh) {
      var vals = days.map(function(iso) {
        var v = planValueForIso(st, sh, iso, currentMk, entry);
        return v !== undefined ? Number(v) : null;
      });
      rows.push({ station: st, shift: sh, vals: vals });
    });
  });
  if (!rows.length) { table.innerHTML = ''; return; }

  var thead = '<thead><tr><th class="lbl">Stanowisko<span class="cn">工位</span></th>';
  days.forEach(function(iso) {
    var dd = iso.split('-');
    var wd = isoToDateObj(iso).getDay();
    var wi = (wd + 6) % 7;
    var outside = iso < monthStartIso || iso > monthEndIso;
    thead += '<th class="' + (wd === 0 || wd === 6 ? 'we ' : '') + (outside ? 'adjacent' : '') + '">' + Number(dd[2]) + '<br>' + WD_SHORT[wi] + '</th>';
  });
  thead += '<th class="sum">Suma<span class="cn">总数</span></th></tr></thead>';

  var byStation = {};
  var order = [];
  rows.forEach(function(r) { if (!byStation[r.station]) { byStation[r.station] = []; order.push(r.station); } byStation[r.station].push(r); });

  var body = '<tbody>';
  order.forEach(function(st, si) {
    var list = byStation[st];
    list.forEach(function(r, ri) {
      var filledVals = r.vals.filter(function(v) { return v !== null && v > 0; });
      var anomSet = detectRowAnomalies(filledVals);
      var isLastOfStation = ri === list.length - 1;
      body += '<tr' + (isLastOfStation && si < order.length - 1 ? ' class="stgap"' : '') + '>';
      body += '<td class="lbl">' + (ri === 0 ? '<b>' + st + '</b> ' : '') + '<span class="sh"><i style="background:' + shiftColor(r.shift) + '"></i>' + r.shift + '</span></td>';
      var sum = 0;
      r.vals.forEach(function(v, i) {
        var iso = days[i];
        var wd = isoToDateObj(iso).getDay();
        var we = wd === 0 || wd === 6;
        var outside = iso < monthStartIso || iso > monthEndIso;
        var cls = (we ? 'we ' : '') + (outside ? 'adjacent ' : '');
        if (v === null || v <= 0) { body += '<td class="' + cls + 'empty">&#183;</td>'; return; }
        if (!outside) sum += v;
        var anom = anomSet[String(v)];
        body += '<td class="' + cls + (anom ? 'anom' : '') + '">' + v + '</td>';
      });
      body += '<td class="sum">' + sum.toLocaleString('pl-PL') + '</td>';
      body += '</tr>';
    });
  });
  body += '</tbody>';
  table.innerHTML = thead + body;
}
function refreshPlanGrid() {
  var y = STATE.viewMonth.getFullYear(), m = STATE.viewMonth.getMonth();
  renderPlanGrid(y, m, daysInMonth(STATE.viewMonth), collectPlanFromInputs());
}

function setDaysOpen(card, open) {
  var strip = card.querySelector('.daystrip');
  var btn = card.querySelector('.btn-mini.toggle');
  strip.style.display = open ? 'flex' : 'none';
  btn.classList.toggle('open', open);
  btn.innerHTML = 'Dni ' + (open ? '&#9652;' : '&#9662;') + ' <span class="cn">天数</span> (' + strip.querySelectorAll('input').length + ')';
}
function toggleDays(btn) {
  var card = btn.closest('.shiftcard');
  var open = card.querySelector('.daystrip').style.display !== 'none';
  setDaysOpen(card, !open);
}

// Wypelnia tylko pon-pt — sobota i niedziela to nie standardowe dni
// robocze (sobota bywa dodatkowa zmiana, wiec zostaje do recznego
// wstawienia w rozwinietych dniach, tam gdzie faktycznie pracowano).
function quickCopy(btn) {
  var card = btn.closest('.shiftcard');
  var n = Number(card.querySelector('.quickval').value) || 0;
  if (n <= 0) { showToast('Wpisz liczbę większą od 0 · 请输入大于0的数字', 'err'); return; }
  card.querySelectorAll('.daystrip input').forEach(function(el) {
    var parts = el.dataset.date.split('-');
    var wd = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).getDay();
    if (wd !== 0 && wd !== 6) el.value = n;
  });
  setDaysOpen(card, true);
  markDirty();
  refreshPlanGrid();
  showToast('Skopiowano na pon–pt — pamiętaj kliknąć "Zapisz plan"! · 已复制 — 别忘了点击"保存计划"!', 'ok');
}

// Czysci WSZYSTKIE dni tej zmiany naraz (np. gdy przez pomylke wpisano
// wartosc w cala zmiane, ktorej w ogole nie trzeba planowac) — "Kopiuj
// pon-pt" celowo nie przyjmuje 0 (to by bylo mylace jako "kopiuj"), wiec
// czyszczenie jest osobnym, wyraznie nazwanym przyciskiem. Potwierdzenie
// zabezpiecza przed przypadkowym skasowaniem calego miesiaca dla tej
// zmiany jednym kliknieciem.
function clearShiftDays(btn) {
  var card = btn.closest('.shiftcard');
  var filled = card.querySelectorAll('.daystrip input').length && Array.prototype.filter.call(card.querySelectorAll('.daystrip input'), function(el) { return el.value !== ''; }).length;
  if (filled > 0 && !confirm('Wyczyścić wszystkie dni tej zmiany (' + filled + ' wypełnionych)? Tego nie da się cofnąć (dopóki nie klikniesz Zapisz, zmiana jest tylko lokalna).')) return;
  card.querySelectorAll('.daystrip input').forEach(function(el) { el.value = ''; });
  card.querySelector('.quickval').value = '';
  markDirty();
  refreshPlanGrid();
  showToast('Wyczyszczono — pamiętaj kliknąć "Zapisz plan"! · 已清空 — 别忘了点击"保存计划"!', 'ok');
}

function collectPlanFromInputs() {
  var entry = {};
  // :not([data-shiprow]) — wiersze Wysylki (Plan/Wyslano) uzywaja tej samej
  // klasy .daystrip (dla wspolnego stylu i wspolnych funkcji quickCopy/
  // toggleDays/clearShiftDays), ale maja WLASNA plaska strukture
  // (data-shiprow zamiast data-station+data-shift) — patrz
  // collectShippingFromInputs. Bez tego wykluczenia trafialyby tutaj jako
  // stanowisko "undefined".
  document.querySelectorAll('.daystrip input:not([data-shiprow])').forEach(function(el) {
    var st = el.dataset.station, sh = el.dataset.shift, iso = el.dataset.date;
    var v = Number(el.value) || 0;
    if (v > 0) {
      if (!entry[st]) entry[st] = {};
      if (!entry[st][sh]) entry[st][sh] = {};
      entry[st][sh][iso] = v;
    }
  });
  return entry;
}

// Wysylki (Plan / Wyslano) — jedna plaska liczba dzien->ilosc, bez podzialu
// na stanowisko/zmiane (to jeden wspolny produkt wychodzacy z magazynu).
// Ten sam wzorzec UI co karty stanowisk (analyzeShift dziala na dowolnej
// plaskiej mapie iso->wartosc, wiec dziala tu bez zmian).
function collectShippingFromInputs(kind) {
  var entry = {};
  document.querySelectorAll('.daystrip input[data-shiprow="' + kind + '"]').forEach(function(el) {
    var iso = el.dataset.date;
    var v = Number(el.value) || 0;
    if (v > 0) entry[iso] = v;
  });
  return entry;
}
function renderShippingRow(kind, label, cnLabel, y, m, nDays, flatEntry) {
  var info = analyzeShift(flatEntry, y, m, nDays);
  var expand = info.filledCount > 0 && !info.uniform;
  var dayCells = '';
  for (var d = 1; d <= nDays; d++) {
    var iso = dateISO(y, m, d);
    var wd = new Date(y, m, d).getDay();
    var isSun = wd === 0;
    var val = flatEntry[iso] !== undefined ? flatEntry[iso] : '';
    dayCells += '<div class="daycell' + (isSun ? ' sun' : '') + '"><div class="dlabel">' + d + ' ' + WD[(wd + 6) % 7] + '</div><input type="number" min="0" value="' + val + '" data-shiprow="' + kind + '" data-date="' + iso + '"></div>';
  }
  return '<div class="shiftcard" data-shiprow="' + kind + '">' +
    '<div class="shiftcard-head">' +
      '<span class="shiftpill">' + label + '<span class="cn">' + cnLabel + '</span></span>' +
      '<input type="number" min="0" class="quickval" placeholder="np. 1120" value="' + info.quickVal + '">' +
      '<button type="button" class="btn-mini copy" onclick="quickCopy(this)">Kopiuj pon&#8211;pt<small>复制周一至周五</small></button>' +
      '<button type="button" class="btn-mini clear" onclick="clearShiftDays(this)">Wyczyść dni<small>清空天数</small></button>' +
      '<button type="button" class="btn-mini toggle' + (expand ? ' open' : '') + '" onclick="toggleDays(this)">Dni ' + (expand ? '&#9652;' : '&#9662;') + ' <span class="cn">天数</span> (' + info.filledCount + ')</button>' +
    '</div>' +
    '<div class="daystrip" style="display:' + (expand ? 'flex' : 'none') + ';">' + dayCells + '</div>' +
  '</div>';
}

// ── WGRYWANIE PLANU WYSYLEK Z EXCELA OD KLIENTA ─────────────────────────
// Klient (Tesla) wysyla harmonogram wysylek jako .xlsx z arkuszem
// zawierajacym wiersz "Ship Date" (daty w kolumnach) i osobny wiersz
// nizej z kolumna "UoM" jako ostatnia etykieta przed danymi — zaraz pod
// nim zaczynaja sie wiersze z ilosciami w tych samych kolumnach co daty.
// User potwierdzil ze ten uklad jest zawsze taki sam.
var HORIZON_DAYS = 180; // ile dni od pierwszej daty w pliku importujemy
function normalizeExcelDate(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (raw instanceof Date) return isoFromDateObj(raw);
  if (typeof raw === 'string') {
    var m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    var d = new Date(raw);
    if (!isNaN(d.getTime())) return isoFromDateObj(d);
    return null;
  }
  if (typeof raw === 'number') {
    var epoch = new Date(Date.UTC(1899, 11, 30));
    return isoFromDateObj(new Date(epoch.getTime() + raw * 86400000));
  }
  return null;
}
function isoFromDateObj(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function isoToDateObj(iso) { var p = iso.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }

// aoa = tablica wierszy (array-of-arrays) z XLSX.utils.sheet_to_json(ws,{header:1}).
// Zwraca {monthKey: {dateIso: ilosc}} albo null jesli nie rozpoznano ukladu.
function parseShippingExcelFromAOA(rows) {
  var shipRowIdx = -1, shipColStart = -1;
  rows.forEach(function(row, ri) {
    (row || []).forEach(function(cell, ci) {
      if (String(cell === undefined || cell === null ? '' : cell).trim() === 'Ship Date') { shipRowIdx = ri; shipColStart = ci + 1; }
    });
  });
  if (shipRowIdx === -1) return null;

  var uomRowIdx = -1;
  rows.forEach(function(row, ri) {
    (row || []).forEach(function(cell) {
      if (String(cell === undefined || cell === null ? '' : cell).trim() === 'UoM') uomRowIdx = ri;
    });
  });
  if (uomRowIdx === -1) return null;

  var dateRow = rows[shipRowIdx] || [];
  var result = {};
  var firstDateSeen = null;

  for (var dr = uomRowIdx + 1; dr < rows.length; dr++) {
    var dataRow = rows[dr];
    if (!dataRow || dataRow.every(function(c) { return c === null || c === undefined || c === ''; })) continue;
    for (var c = shipColStart; c < dateRow.length; c++) {
      var iso = normalizeExcelDate(dateRow[c]);
      if (!iso) continue;
      if (!firstDateSeen) firstDateSeen = iso;
      else if ((isoToDateObj(iso) - isoToDateObj(firstDateSeen)) / 86400000 > HORIZON_DAYS) break;
      var qty = Number(dataRow[c]);
      if (!qty) continue;
      var mk = iso.slice(0, 7);
      if (!result[mk]) result[mk] = {};
      result[mk][iso] = qty;
    }
  }
  return result;
}

function handleShipExcelFile(file) {
  if (typeof XLSX === 'undefined') { showToast('Biblioteka do czytania Excela nie wczytała się — sprawdź połączenie internetowe i odśwież stronę · Excel读取库未加载', 'err'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var wb;
    try { wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); } catch (err) { showToast('Nie udało się odczytać pliku · 无法读取文件', 'err'); return; }
    var newPlan = null;
    for (var i = 0; i < wb.SheetNames.length && !newPlan; i++) {
      var aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, raw: true, defval: null });
      newPlan = parseShippingExcelFromAOA(aoa);
    }
    if (!newPlan || !Object.keys(newPlan).length) { showToast('Nie rozpoznano układu pliku (brak "Ship Date"/"UoM") · 无法识别文件格式', 'err'); return; }
    showShipDiff(newPlan);
  };
  reader.readAsArrayBuffer(file);
}

// Porownuje nowy plan (z Excela) z aktualnym STATE.shippingPlan — kazdy
// dzien z pliku jest albo "nowy" (nie bylo go wczesniej), "zmieniony"
// (byla inna wartosc) albo pomijany w tabeli roznic jesli identyczny
// (nie ma sensu pokazywac tego co i tak sie zgadza).
function computeShippingDiff(newPlan) {
  var changes = [];
  var sameCount = 0;
  Object.keys(newPlan).sort().forEach(function(mk) {
    Object.keys(newPlan[mk]).sort().forEach(function(iso) {
      var newVal = newPlan[mk][iso];
      var oldVal = STATE.shippingPlan[mk] && STATE.shippingPlan[mk][iso] !== undefined ? STATE.shippingPlan[mk][iso] : null;
      if (oldVal === newVal) { sameCount++; return; }
      changes.push({ date: iso, oldVal: oldVal, newVal: newVal, kind: oldVal === null ? 'new' : 'changed' });
    });
  });
  return { changes: changes, sameCount: sameCount };
}

var pendingShipPlan = null;
function showShipDiff(newPlan) {
  pendingShipPlan = newPlan;
  var diff = computeShippingDiff(newPlan);
  var panel = document.getElementById('shipDiffPanel');
  if (!panel) return;
  if (!diff.changes.length) {
    panel.innerHTML = '<div class="diffpanel"><div class="diffpanel-summary">Plik wczytany — wszystkie ' + diff.sameCount + ' dni już zgadzają się z aktualnym planem, nic do zatwierdzenia. <span class="cn">文件已读取，全部' + diff.sameCount + '天与当前计划一致，无需确认。</span></div></div>';
    return;
  }
  var rows = diff.changes.map(function(c) {
    var dd = c.date.split('-');
    return '<tr class="' + c.kind + '"><td>' + dd[2] + '/' + dd[1] + '/' + dd[0] + '</td><td>' + (c.oldVal === null ? '&#8212;' : c.oldVal) + '</td><td>' + c.newVal + '</td></tr>';
  }).join('');
  panel.innerHTML = '<div class="diffpanel">' +
    '<div class="diffpanel-head"><h3>Znalezione różnice <span class="cn">发现的差异</span></h3>' +
    '<div class="diffpanel-summary">' + diff.changes.length + ' dni różnych/nowych, ' + diff.sameCount + ' bez zmian</div></div>' +
    '<div style="overflow-x:auto"><table class="difftable"><thead><tr><th>Data</th><th>Było</th><th>Z pliku</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="diffpanel-actions">' +
      '<button type="button" class="btn-diff approve" onclick="approveShipDiff()">Zatwierdź i zastosuj<br><small style="font-family:var(--fb);font-weight:400;text-transform:none">确认并应用</small></button>' +
      '<button type="button" class="btn-diff cancel" onclick="cancelShipDiff()">Anuluj<br><small style="font-family:var(--fb);font-weight:400;text-transform:none">取消</small></button>' +
    '</div></div>';
}
function approveShipDiff() {
  if (!pendingShipPlan) return;
  Object.keys(pendingShipPlan).forEach(function(mk) {
    if (!STATE.shippingPlan[mk]) STATE.shippingPlan[mk] = {};
    Object.keys(pendingShipPlan[mk]).forEach(function(iso) { STATE.shippingPlan[mk][iso] = pendingShipPlan[mk][iso]; });
  });
  pendingShipPlan = null;
  document.getElementById('shipDiffPanel').innerHTML = '';
  markDirty();
  render();
  showToast('Zastosowano — pamiętaj kliknąć "Zapisz plan"! · 已应用 — 别忘了点击"保存计划"!', 'ok');
}
function cancelShipDiff() {
  pendingShipPlan = null;
  document.getElementById('shipDiffPanel').innerHTML = '';
}

function copyFromPrevMonth() {
  var prev = new Date(STATE.viewMonth.getFullYear(), STATE.viewMonth.getMonth() - 1, 1);
  var prevEntry = STATE.plan[monthKey(prev)];
  if (!prevEntry) { showToast('Brak planu w poprzednim miesiącu · 上月无计划', 'err'); return; }
  var prevDays = daysInMonth(prev);
  var thisDays = daysInMonth(STATE.viewMonth);
  var y = STATE.viewMonth.getFullYear(), m = STATE.viewMonth.getMonth();
  var newEntry = {};
  Object.keys(prevEntry).forEach(function(st) {
    newEntry[st] = {};
    Object.keys(prevEntry[st]).forEach(function(sh) {
      newEntry[st][sh] = {};
      Object.keys(prevEntry[st][sh]).forEach(function(iso) {
        var dayNum = Number(iso.split('-')[2]);
        if (dayNum <= thisDays) newEntry[st][sh][dateISO(y, m, dayNum)] = prevEntry[st][sh][iso];
      });
    });
  });
  STATE.plan[monthKey(STATE.viewMonth)] = newEntry;
  render();
  markDirty();
  showToast('Skopiowano z poprzedniego miesiąca — pamiętaj kliknąć "Zapisz plan"! · 已从上月复制 — 别忘了点击"保存计划"!', 'ok');
}

function savePlan() {
  var mk = monthKey(STATE.viewMonth);
  STATE.plan[mk] = collectPlanFromInputs();
  STATE.shippingPlan[mk] = collectShippingFromInputs('plan');
  STATE.shippingActual[mk] = collectShippingFromInputs('actual');
  localStorage.setItem('cfm_monthly_plan', JSON.stringify(STATE.plan));
  localStorage.setItem('cfm_shipping_plan', JSON.stringify(STATE.shippingPlan));
  localStorage.setItem('cfm_shipping_actual', JSON.stringify(STATE.shippingActual));
  clearDirty();

  var wh = getWH();
  Promise.all([
    fetch(wh, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_monthly_plan', wartosc: JSON.stringify(STATE.plan) }) }),
    fetch(wh, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_shipping_plan', wartosc: JSON.stringify(STATE.shippingPlan) }) }),
    fetch(wh, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ event_type: 'ZAPISZ_USTAWIENIE', klucz: 'cfm_shipping_actual', wartosc: JSON.stringify(STATE.shippingActual) }) })
  ]).then(function() {
    showToast('Plan zapisany! · 计划已保存!', 'ok');
  }).catch(function() {
    showToast('Zapisano lokalnie, błąd wysyłki · 已本地保存，发送失败', 'err');
  });
}

init();
</script>
