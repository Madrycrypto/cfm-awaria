<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>CFM · Statystyki</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Cg fill='%231A6ED8'%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(0 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(120 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(240 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='9' fill='%230d0d0d' stroke='%231A6ED8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#161616;--surface-2:#1c1c1c;--border:#262626;--border-soft:#1e1e1e;
  --text:#f2f2f2;--muted:#9a9a9a;--faint:#5c5c5c;
  --blue:#1A6ED8;--blue-soft:#2f7fe0;--green:#1A9E50;--red:#D92B2B;--orange:#D97706;
  --shift-a:#5AA9FF;--shift-b:#1A6ED8;--shift-c:#0B3D91;
  --good-bg:rgba(26,158,80,0.14);--warn-bg:rgba(217,119,6,0.16);--crit-bg:rgba(217,43,43,0.16);
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fc:'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.cn{font-family:var(--fc);color:var(--faint);font-weight:400}
::selection{background:var(--blue);color:#fff}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:0.5px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.topbar-right{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
.topbar-right .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.topbar-right .live.off{color:var(--red)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-pulse{animation:none}}

.pagehead{padding:28px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-family:var(--fh);font-weight:800;font-size:30px;letter-spacing:0.2px}
h1 .cn{font-family:var(--fc);font-size:16px;font-weight:500;margin-left:8px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.monthnav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px}
.monthnav button{background:none;border:none;color:var(--muted);font-size:18px;padding:6px 12px;cursor:pointer;border-radius:8px}
.monthnav button:hover{color:var(--text);background:var(--surface-2)}
.monthnav .mlabel{font-family:var(--fh);font-weight:700;font-size:14px;letter-spacing:0.3px;text-transform:uppercase;min-width:130px;text-align:center}
.monthnav .mlabel .cn{font-size:11px;text-transform:none;margin-left:4px}
.headactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-export{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:0.02em;color:#fff;background:var(--green);border:none;padding:10px 16px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-export:hover{background:#22b45c}
.btn-export .cn{color:rgba(255,255,255,0.75);font-size:11px}

.weekpicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.weekpicker button{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:0.02em;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.weekpicker button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.weekpicker button:not(.on):hover{color:var(--text);border-color:var(--faint)}
.weekpicker .sep{width:1px;background:var(--border);margin:2px 4px}
.weekpicker button.month{border-style:dashed}
.weekpicker button.month.on{background:var(--green);border-color:var(--green)}

.reasonbtn{font-family:var(--fb);font-weight:600;font-size:10.5px;color:var(--muted);background:none;border:1px solid var(--border-soft);border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:10px}
.reasonbtn:hover{color:var(--text);border-color:var(--faint)}
.reasonbox{display:none;margin-top:8px;flex-wrap:wrap;gap:6px}
.reasonbox.open{display:flex}
.reason-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--text);white-space:normal}
.reason-chip b{font-family:var(--fh);color:var(--blue-soft)}
.reason-chip.scrap b{color:#ff7070}
.reason-chip.rework b{color:#f0a030}
.reason-chip.off{color:var(--faint)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
.kpi-lbl .cn{display:block;text-transform:none;font-size:11px;margin-top:2px;letter-spacing:0}
.kpi-val{font-family:var(--fh);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;margin-top:8px;font-weight:600;color:var(--faint)}
.kpi-bar{height:4px;border-radius:2px;background:var(--border-soft);margin-top:12px;overflow:hidden}
.kpi-bar i{display:block;height:100%;border-radius:2px;transition:width .5s}

.section{margin-bottom:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.section-head h2{font-family:var(--fh);font-weight:700;font-size:19px;letter-spacing:0.2px}
.section-head h2 .cn{font-family:var(--fc);font-size:13px;font-weight:500;margin-left:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tablescroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
thead th{font-family:var(--fb);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:right;padding:12px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th.today{color:var(--blue-soft)}
thead th .cn{display:block;text-transform:none;font-size:9.5px;color:var(--faint);margin-top:2px}
tbody td{padding:9px 12px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr.grouphead td{padding-top:16px}
.stationname{font-family:var(--fh);font-weight:700;font-size:15px;color:var(--text)}
.shiftpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:0.03em}
.shiftpill i{width:7px;height:7px;border-radius:50%}
.cell-stack{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cell-actual{font-weight:700;color:var(--text)}
.cell-plan{font-size:10.5px;color:var(--faint)}
.pct{display:inline-block;min-width:48px;padding:3px 7px;border-radius:6px;font-weight:700;font-size:12px}
.pct.good{background:var(--good-bg);color:#3fd17a}
.pct.warn{background:var(--warn-bg);color:#f0a030}
.pct.crit{background:var(--crit-bg);color:#ff7070}
.pct.off{color:var(--faint);background:none;font-weight:500}
.rowtotal{font-weight:800;color:var(--text)}
.subrow td{padding-top:2px;padding-bottom:10px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--border-soft)}
.subrow .pr{font-variant-numeric:tabular-nums;font-weight:600}

.barsgrid{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.barrow{display:grid;grid-template-columns:170px 1fr 130px;align-items:center;gap:16px}
.barrow-lbl{font-family:var(--fh);font-weight:700;font-size:14px}
.bartrack{position:relative;height:22px;background:var(--border-soft);border-radius:6px;overflow:hidden}
.barfill{position:absolute;left:0;top:0;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.3,.8,.4,1)}
.barrow-pct{text-align:right;font-variant-numeric:tabular-nums}
.barrow-pct b{font-family:var(--fh);font-size:17px;font-weight:800}

.note{display:flex;gap:12px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}
.note .ic{font-family:var(--fh);font-weight:900;font-size:18px;color:var(--blue-soft);flex-shrink:0}
.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.8}
.empty a{color:var(--blue-soft)}

@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  h1{font-size:24px}
  .barrow{grid-template-columns:120px 1fr 90px;gap:10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="dot"></span>CFM</div>
    <div class="crumb"><b>Statystyki produkcji <span class="cn">生产统计</span></b></div>
    <div class="topbar-right">
      <div class="live" id="liveStatus"><span class="live-pulse"></span>łączenie&#8230; <span class="cn">连接中&#8230;</span></div>
      <div id="lastUpdate"></div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>
</div>

<script>
function getWH() { return localStorage.getItem('cfm_raport_webhook') || ''; }

var STATE = { monthDate: new Date(), rows: [], reworkRows: [], weeks: [], selectedWeekIdx: 0, viewMode: 'week', stations: [], shiftLabels: ['A', 'B', 'C'] };

function pad(n) { return String(n).padStart(2, '0'); }
function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function mondayOf(d) { var x = new Date(d); var day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
var MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
var MONTH_NAMES_CN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var DAY_LABELS = ['PON','WT','ŚR','CZW','PT','SOB','NDZ'];
var DAY_LABELS_CN = ['周一','周二','周三','周四','周五','周六','周日'];

function monthRange(d) {
  var start = new Date(d.getFullYear(), d.getMonth(), 1);
  var end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start: toISO(start), end: toISO(end), startD: start, endD: end };
}

function init() {
  var wh = getWH();
  var liveEl = document.getElementById('liveStatus');
  if (!wh) {
    liveEl.className = 'live off';
    liveEl.innerHTML = '<span class="live-pulse"></span>brak połączenia <span class="cn">未连接</span>';
    document.getElementById('app').innerHTML = '<div class="empty">Nie skonfigurowano połączenia na tym urządzeniu.<br><span class="cn">此设备尚未配置连接。</span><br><br>Otwórz główną apkę CFM &#8594; Panel Admina &#8594; Połączenie, skonfiguruj Webhook URL, wróć tutaj i odśwież stronę.<br><span class="cn">打开CFM主应用 &#8594; 管理面板 &#8594; 连接，配置Webhook网址，然后返回此页面刷新。</span></div>';
    return;
  }
  // Lista stanowisk/zmian (do pokazania WSZYSTKICH stanowisk w tabeli,
  // nawet tych bez wpisow w danym okresie — nie tylko OP40 OUT, ktore
  // celowo pomijamy, bo jego cel i tak jest zawsze kopia OP40 IN) — nie
  // trzeba tego odswiezac co 45s razem z reszta, wystarczy raz na start.
  fetch(wh + '?event_type=GET_USTAWIENIA')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var u = (data && data.ustawienia) || {};
      try { STATE.stations = JSON.parse(u.cfm_stations || '[]'); } catch (e) { STATE.stations = []; }
      try {
        var shifts = JSON.parse(u.cfm_shifts || 'null');
        if (shifts && shifts.zmiany && shifts.zmiany.length) STATE.shiftLabels = shifts.zmiany.map(function(z) { return z.label; });
      } catch (e) {}
    })
    .catch(function() {})
    .then(loadMonth);

  // Auto-odswiezanie — strona sama NIE wie kiedy ktos wyslal raport w
  // apce, wiec dopytujemy backend co jakis czas w tle (bez migania
  // "Ladowanie..." i bez zrzucania widoku ktory user akurat oglada), plus
  // natychmiast po powrocie na te karte/zakladke (np. przelaczenie z apki
  // z powrotem na statystyki).
  setInterval(function() { loadMonth({ silent: true, keepSelection: true }); }, 45000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) loadMonth({ silent: true, keepSelection: true });
  });
}

function loadMonth(opts) {
  opts = opts || {};
  var wh = getWH();
  var r = monthRange(STATE.monthDate);
  if (!opts.silent) document.getElementById('app').innerHTML = '<div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>';
  fetch(wh + '?event_type=STATYSTYKI&start=' + r.start + '&end=' + r.end)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var liveEl = document.getElementById('liveStatus');
      if (data.status !== 'ok') {
        liveEl.className = 'live off';
        liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
        document.getElementById('app').innerHTML = '<div class="empty">Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span></div>';
        return;
      }
      liveEl.className = 'live';
      liveEl.innerHTML = '<span class="live-pulse"></span>zasilane z RaportDzienny <span class="cn">数据来自日报表</span>';
      document.getElementById('lastUpdate').textContent = 'odświeżono: ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) + ' · 已更新';
      STATE.rows = data.historia || [];
      STATE.reworkRows = data.rework_historia || [];
      computeWeeks(opts.keepSelection);
      render();
    })
    .catch(function() {
      var liveEl = document.getElementById('liveStatus');
      liveEl.className = 'live off';
      liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
      document.getElementById('app').innerHTML = '<div class="empty">Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span></div>';
    });
}

function computeWeeks(keepSelection) {
  var r = monthRange(STATE.monthDate);
  var firstMonday = mondayOf(r.startD);
  var weeks = [];
  var cursor = firstMonday;
  while (cursor <= r.endD) {
    var days = [];
    for (var i = 0; i < 7; i++) days.push(toISO(addDays(cursor, i)));
    weeks.push({ start: days[0], end: days[6], days: days });
    cursor = addDays(cursor, 7);
  }
  STATE.weeks = weeks;
  // Przy cichym auto-odswiezeniu (keepSelection) nie przeskakujemy
  // uzytkownikowi z powrotem na "dzisiejszy" tydzien/widok — zostaje na
  // tym, co akurat sobie ogladal.
  if (keepSelection && STATE.selectedWeekIdx < weeks.length) return;
  var todayISO = toISO(new Date());
  var idx = weeks.findIndex(function(w) { return todayISO >= w.start && todayISO <= w.end; });
  STATE.selectedWeekIdx = idx >= 0 ? idx : weeks.length - 1;
}

function groupByStationShift(rows) {
  var map = {};
  var order = [];
  rows.forEach(function(r) {
    var key = r.station + '||' + r.shift;
    if (!map[key]) { map[key] = { station: r.station, shift: r.shift, byDate: {} }; order.push(key); }
    map[key].byDate[r.date] = r;
  });
  order.sort(function(a, b) {
    var ga = map[a], gb = map[b];
    if (ga.station !== gb.station) return ga.station < gb.station ? -1 : 1;
    return ga.shift < gb.shift ? -1 : ga.shift > gb.shift ? 1 : 0;
  });
  return order.map(function(k) { return map[k]; });
}

// Jak groupByStationShift, ale zamiast pokazywac TYLKO te stanowiska,
// ktore akurat maja wpis w danym okresie, pokazuje WSZYSTKIE skonfigurowane
// stanowiska (w kolejnosci z Panelu Admina) — puste tez, zeby od razu bylo
// widac ktore stanowisko nie wyslalo jeszcze raportu. OP40 OUT pomijamy
// zawsze — jego cel jest kopia OP40 IN, wiec nie ma osobnej linii.
// Bez skonfigurowanej listy stanowisk (np. GET_USTAWIENIA jeszcze sie nie
// wczytalo) spada z powrotem na "tylko to co jest w danych".
function buildGroups(rows) {
  var discovered = groupByStationShift(rows);
  if (!STATE.stations.length) return discovered;
  var byKey = {};
  discovered.forEach(function(g) { byKey[g.station + '||' + g.shift] = g; });
  var list = [];
  STATE.stations.forEach(function(st) {
    if (st === 'OP40 OUT') return;
    STATE.shiftLabels.forEach(function(sh) {
      var key = st + '||' + sh;
      list.push(byKey[key] || { station: st, shift: sh, byDate: {} });
    });
  });
  return list;
}

function shiftColor(s) { return s === 'A' ? 'var(--shift-a)' : s === 'B' ? 'var(--shift-b)' : 'var(--shift-c)'; }
function pctClass(p) { if (p === null) return 'off'; if (p >= 95) return 'good'; if (p >= 80) return 'warn'; return 'crit'; }
function fmt(n) { return n === null || n === undefined ? '&#8212;' : n.toLocaleString('pl-PL'); }

function monthDays(monthDate) {
  var r = monthRange(monthDate);
  var days = [];
  var cursor = new Date(r.startD);
  while (cursor <= r.endD) { days.push(toISO(cursor)); cursor = addDays(cursor, 1); }
  return days;
}

// Zlicza powody scrap/rework (z reasons_json kazdego RaportDzienny) w
// podanym zestawie wpisow — pokazywane jako "chmurki" pod paskiem pass
// rate, zeby bylo widac CO konkretnie odpadlo, a nie tylko sam procent.
function aggregateReasons(rows) {
  var tally = {};
  rows.forEach(function(r) {
    if (!r.reasons_json) return;
    var parsed;
    try { parsed = JSON.parse(r.reasons_json); } catch (e) { return; }
    (parsed.scrap || []).forEach(function(e) { addTally('scrap', e); });
    (parsed.rework || []).forEach(function(e) { addTally('rework', e); });
  });
  function addTally(cat, e) {
    var qty = Number(e.qty) || 0;
    if (qty <= 0) return;
    var reason = e.reason || 'Inne';
    var key = cat + '||' + reason;
    if (!tally[key]) tally[key] = { category: cat, reason: reason, qty: 0 };
    tally[key].qty += qty;
  }
  return Object.keys(tally).map(function(k) { return tally[k]; }).sort(function(a, b) { return b.qty - a.qty; });
}

function reasonsHtml(reasons) {
  if (!reasons.length) return '<span class="reason-chip off">brak zarejestrowanych powodów &#183; 未记录原因</span>';
  return reasons.map(function(rs) {
    var lbl = rs.category === 'scrap' ? 'scrap' : 'rework';
    return '<span class="reason-chip ' + rs.category + '"><b>' + rs.qty + '&#215;</b>' + rs.reason + ' <span class="cn">(' + lbl + ')</span></span>';
  }).join('');
}

function render() {
  var app = document.getElementById('app');
  if (!STATE.rows.length) {
    app.innerHTML = '<div class="pagehead"><div><h1>Plan vs. wykonanie <span class="cn">计划与完成</span></h1><div class="sub">' + MONTH_NAMES[STATE.monthDate.getMonth()] + ' ' + STATE.monthDate.getFullYear() + '</div></div>' + monthNavHtml() + '</div><div class="empty">Brak wpisów w tym miesiącu. <span class="cn">本月无记录。</span></div>';
    wireMonthNav();
    return;
  }

  var isMonth = STATE.viewMode === 'month';
  var days = isMonth ? monthDays(STATE.monthDate) : STATE.weeks[STATE.selectedWeekIdx].days;
  var periodLabel = isMonth ? 'mies.' : 'tyg.';
  var groups = buildGroups(STATE.rows);
  var periodGroups = buildGroups(STATE.rows.filter(function(r) { return days.indexOf(r.date) >= 0; }));

  app.innerHTML =
    '<div class="pagehead"><div><h1>Plan vs. wykonanie <span class="cn">计划与完成</span></h1><div class="sub" id="weekLabel"></div></div>' +
    '<div class="headactions">' + monthNavHtml() + '<button class="btn-export" id="btnRefresh" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border)">Odśwież <span class="cn">刷新</span></button><button class="btn-export" id="btnExport">Eksportuj Excel <span class="cn">导出Excel</span></button></div></div>' +
    '<div class="weekpicker" id="weekPicker"></div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<div class="section"><div class="section-head"><h2>Wykonanie planu &#183; dzień po dniu<span class="cn">计划完成率 &#183; 逐日</span></h2><div class="legend">' +
      '<span><i style="background:#3fd17a"></i>&#8805; 95%</span><span><i style="background:#f0a030"></i>80&#8211;94%</span><span><i style="background:#ff7070"></i>&lt; 80%</span>' +
    '</div></div><div class="tablewrap"><div class="tablescroll"><table id="pivot"></table></div></div></div>' +
    '<div class="section"><div class="section-head"><h2>Miesięczny bilans planu &#183; ' + MONTH_NAMES[STATE.monthDate.getMonth()].toLowerCase() + '<span class="cn">月度计划平衡</span></h2></div><div class="barsgrid" id="bars"></div></div>' +
    '<div class="section"><div class="section-head"><h2>Rework &#183; ile faktycznie odzyskano<span class="cn">返修 &#183; 实际挽回比例</span></h2></div><div class="barsgrid" id="reworkBalance"></div></div>';

  wireMonthNav();
  renderWeekPicker();
  var filledCount = periodGroups.filter(function(g) { return Object.keys(g.byDate).length > 0; }).length;
  document.getElementById('weekLabel').textContent = (isMonth ? 'Cały miesiąc' : fmtWeekRangePlain(STATE.weeks[STATE.selectedWeekIdx])) + ' · ' + filledCount + '/' + periodGroups.length + ' pozycji z wpisami · ' + filledCount + '/' + periodGroups.length + ' 项有记录';
  renderKpis(periodGroups, days, periodLabel);
  renderPivot(periodGroups, days, periodLabel);
  renderBars(groups);
  renderReworkBalance(days);
}

function fmtWeekRange(week) {
  var s = week.start.split('-'), e = week.end.split('-');
  return s[2] + '/' + s[1] + ' &#8211; ' + e[2] + '/' + e[1];
}
function fmtWeekRangePlain(week) {
  var s = week.start.split('-'), e = week.end.split('-');
  return s[2] + '/' + s[1] + ' – ' + e[2] + '/' + e[1];
}

function monthNavHtml() {
  return '<div class="monthnav"><button id="prevMonth">&#8249;</button><div class="mlabel">' + MONTH_NAMES[STATE.monthDate.getMonth()] + ' ' + STATE.monthDate.getFullYear() + '<span class="cn">' + MONTH_NAMES_CN[STATE.monthDate.getMonth()] + '</span></div><button id="nextMonth">&#8250;</button></div>';
}
function wireMonthNav() {
  document.getElementById('prevMonth').onclick = function() { STATE.monthDate = new Date(STATE.monthDate.getFullYear(), STATE.monthDate.getMonth() - 1, 1); loadMonth(); };
  document.getElementById('nextMonth').onclick = function() { STATE.monthDate = new Date(STATE.monthDate.getFullYear(), STATE.monthDate.getMonth() + 1, 1); loadMonth(); };
  var exportBtn = document.getElementById('btnExport');
  if (exportBtn) exportBtn.onclick = exportToExcel;
  var refreshBtn = document.getElementById('btnRefresh');
  if (refreshBtn) refreshBtn.onclick = function() { loadMonth({ keepSelection: true }); };
}

// Eksport calego miesiaca (nie tylko wybranego tygodnia) do pliku .xls —
// zwykla tabela HTML zapisana z rozszerzeniem .xls, ktora Excel otwiera
// bezposrednio (dziala offline, bez zadnej biblioteki/CDN, spojnie z
// reszta apki). Przy otwarciu Excel moze zapytac o potwierdzenie formatu
// — to normalne przy tej metodzie, wystarczy kliknac "Tak".
function exportToExcel() {
  if (!STATE.rows.length) { return; }
  var days = monthDays(STATE.monthDate);
  var groups = buildGroups(STATE.rows);
  var byStation = {}, stationOrder = [];
  groups.forEach(function(g) { if (!byStation[g.station]) { byStation[g.station] = []; stationOrder.push(g.station); } byStation[g.station].push(g); });

  var title = 'Plan vs. wykonanie — ' + MONTH_NAMES[STATE.monthDate.getMonth()] + ' ' + STATE.monthDate.getFullYear();
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="UTF-8">' +
    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +
    '<x:Name>Plan vs wykonanie</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>' +
    '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->' +
    '<style>' +
    'table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11px}' +
    'th,td{border:1px solid #999999;padding:3px 6px;text-align:center;white-space:nowrap;mso-number-format:"@"}' +
    'th{background:#1A6ED8;color:#ffffff;font-weight:bold}' +
    '.station{background:#e8eef7;font-weight:bold;text-align:left;vertical-align:middle}' +
    '.lbl{text-align:left;font-weight:bold;background:#f2f2f2}' +
    '.crit{background:#ffb3b3}.warn{background:#ffe1a8}.good{background:#c9f0d6}' +
    'h1{font-family:Calibri,Arial,sans-serif;font-size:16px}' +
    '</style></head><body>' +
    '<h1>' + title + '</h1><table>';

  html += '<tr><th rowspan="2">Stanowisko</th><th rowspan="2">Zmiana</th><th rowspan="2">Wska&#378;nik</th>';
  days.forEach(function(d) { var dd = d.split('-'); html += '<th>' + dd[2] + '/' + dd[1] + '</th>'; });
  html += '<th rowspan="2">Suma m-c</th></tr><tr>';
  days.forEach(function(d) { var parts = d.split('-'); var wd = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).getDay(); html += '<th>' + DAY_LABELS[(wd + 6) % 7] + '</th>'; });
  html += '</tr>';

  stationOrder.forEach(function(stName) {
    var shifts = byStation[stName];
    shifts.forEach(function(g, si) {
      var planRow = '', actualRow = '', pctRow = '';
      var sumPlan = 0, sumActual = 0;
      days.forEach(function(d) {
        var rec = g.byDate[d];
        var plan = rec ? rec.plan : 0, actual = rec ? rec.qty : 0;
        sumPlan += plan; sumActual += actual;
        var pct = plan > 0 ? Math.round((actual / plan) * 100) : null;
        var cls = pct === null ? '' : (pct >= 95 ? 'good' : pct >= 80 ? 'warn' : 'crit');
        planRow += '<td>' + (plan || '') + '</td>';
        actualRow += '<td class="' + cls + '">' + (actual || '') + '</td>';
        pctRow += '<td class="' + cls + '">' + (pct === null ? '' : pct + '%') + '</td>';
      });
      var totalPct = sumPlan > 0 ? Math.round((sumActual / sumPlan) * 100) : null;
      html += '<tr>' + (si === 0 ? '<td class="station" rowspan="' + (shifts.length * 3) + '">' + stName + '</td>' : '') +
        '<td rowspan="3">Zmiana ' + g.shift + '</td><td class="lbl">Plan</td>' + planRow + '<td>' + sumPlan + '</td></tr>';
      html += '<tr><td class="lbl">Wykonanie</td>' + actualRow + '<td>' + sumActual + '</td></tr>';
      html += '<tr><td class="lbl">% planu</td>' + pctRow + '<td>' + (totalPct === null ? '' : totalPct + '%') + '</td></tr>';
    });
  });

  html += '</table></body></html>';

  var blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CFM_Plan_vs_Wykonanie_' + toISO(STATE.monthDate).slice(0, 7) + '.xls';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function renderWeekPicker() {
  var el = document.getElementById('weekPicker');
  el.innerHTML = STATE.weeks.map(function(w, i) {
    return '<button data-i="' + i + '" class="' + (STATE.viewMode === 'week' && i === STATE.selectedWeekIdx ? 'on' : '') + '">' + fmtWeekRange(w) + '</button>';
  }).join('') + '<span class="sep"></span><button id="btnMonthView" class="month' + (STATE.viewMode === 'month' ? ' on' : '') + '">Cały miesiąc <span class="cn">整月</span></button>';
  document.getElementById('btnMonthView').onclick = function() { STATE.viewMode = 'month'; render(); };
  el.querySelectorAll('button:not(#btnMonthView)').forEach(function(b) {
    b.onclick = function() { STATE.viewMode = 'week'; STATE.selectedWeekIdx = Number(b.dataset.i); render(); };
  });
}

// KPI-e na gorze maja pokazywac PRAWDZIWY wynik fabryki (ile sztuk
// faktycznie gotowych do sprzedania), a NIE sume ze wszystkich stanowisk
// naraz — jedna fizyczna sztuka przechodzi przez OP30->OP33->OP40->...->GP12
// i liczylaby sie za kazdym razem, wielokrotnie zawyzajac wynik. GP12 to
// ostatnie stanowisko (kontrola jakosci koncowej) — kazda sztuka stamtad
// to sztuka gotowa do sprzedania, wiec TYLKO GP12 liczy sie do tych 3
// gornych KPI. Tabela ponizej (per stanowisko) nadal poprawnie pokazuje
// KAZDE stanowisko osobno — to inny, celowo pelny widok.
function renderKpis(groups, days, periodLabel) {
  var gp12Groups = groups.filter(function(g) { return g.station === 'GP12'; });
  var totalActual = 0, totalPlan = 0, totalOk = 0, totalNg = 0;
  gp12Groups.forEach(function(g) {
    days.forEach(function(d) {
      var r = g.byDate[d];
      if (!r) return;
      totalActual += r.qty; totalPlan += r.plan; totalOk += r.ok_count; totalNg += (r.scrap + r.rework);
    });
  });
  var completion = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : null;
  var passRate = totalActual > 0 ? ((totalOk / totalActual) * 100).toFixed(1) : null;
  var periodLbl = periodLabel === 'mies.' ? '(mies.)' : '(tydz.)';
  var periodLblCn = periodLabel === 'mies.' ? '（本月）' : '（本周）';
  var kpis = [
    { lbl: 'Wykonanie planu ' + periodLbl + ' (GP12)', lblCn: '计划完成率' + periodLblCn + '（GP12）', val: completion === null ? '&#8212;' : completion + '%', sub: 'plan: ' + fmt(totalPlan) + ' szt. · 计划', bar: completion === null ? 0 : Math.min(completion, 100), color: completion === null ? 'var(--faint)' : completion >= 95 ? 'var(--green)' : completion >= 80 ? 'var(--orange)' : 'var(--red)' },
    { lbl: 'Pass rate ' + periodLbl + ' (GP12)', lblCn: '合格率' + periodLblCn + '（GP12）', val: passRate === null ? '&#8212;' : passRate + '%', sub: totalNg + ' szt. braków · 件不合格', bar: passRate || 0, color: 'var(--blue)' },
    { lbl: 'Wyprodukowano (GP12)', lblCn: '已生产（GP12）', val: fmt(totalActual), sub: 'zgodnych: ' + fmt(totalOk) + ' · 合格', bar: completion === null ? 0 : Math.min(completion, 100), color: 'var(--blue)' },
    { lbl: 'Wpisów w okresie', lblCn: '本期记录数', val: groups.reduce(function(s, g) { return s + Object.keys(g.byDate).length; }, 0), sub: groups.length + ' stanowisko/zmiana · 工位/班次', bar: 100, color: 'var(--faint)' }
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function(k) {
    return '<div class="kpi"><div class="kpi-lbl">' + k.lbl + '<span class="cn">' + k.lblCn + '</span></div><div class="kpi-val">' + k.val + '</div><div class="kpi-sub">' + k.sub + '</div><div class="kpi-bar"><i style="width:' + Math.max(3, k.bar) + '%;background:' + k.color + '"></i></div></div>';
  }).join('');
}

function renderPivot(groups, days, periodLabel) {
  var table = document.getElementById('pivot');
  var todayISO = toISO(new Date());
  if (!groups.length) { table.parentElement.parentElement.innerHTML = '<div class="empty">Brak wpisów w tym okresie. <span class="cn">本期无记录。</span></div>'; return; }
  var thead = '<thead><tr><th>Stanowisko<span class="cn">工位</span></th><th>Zmiana<span class="cn">班次</span></th>' +
    days.map(function(d) {
      var dd = d.split('-');
      var wd = new Date(Number(dd[0]), Number(dd[1]) - 1, Number(dd[2])).getDay();
      var wi = (wd + 6) % 7;
      return '<th class="' + (d === todayISO ? 'today' : '') + '">' + DAY_LABELS[wi] + '<br><span style="font-weight:400;text-transform:none;font-size:10px">' + dd[2] + '/' + dd[1] + '</span><span class="cn">' + DAY_LABELS_CN[wi] + '</span></th>';
    }).join('') +
    '<th>Suma ' + periodLabel + '<span class="cn">总计</span></th></tr></thead>';

  var byStation = {};
  var stationOrder = [];
  groups.forEach(function(g) { if (!byStation[g.station]) { byStation[g.station] = []; stationOrder.push(g.station); } byStation[g.station].push(g); });

  var rows = '';
  stationOrder.forEach(function(stName) {
    var shifts = byStation[stName];
    shifts.forEach(function(g, si) {
      var periodActual = 0, periodPlan = 0, periodOk = 0, periodQty = 0;
      var periodRows = [];
      var cells = days.map(function(d) {
        var r = g.byDate[d];
        if (!r) return '<td><span class="pct off">&#8212;</span></td>';
        periodActual += r.qty; periodPlan += r.plan; periodOk += r.ok_count; periodQty += r.qty;
        periodRows.push(r);
        return '<td><div class="cell-stack"><span class="cell-actual">' + fmt(r.qty) + '</span><span class="cell-plan">/' + fmt(r.plan) + '</span></div></td>';
      }).join('');
      var periodPct = periodPlan > 0 ? Math.round((periodActual / periodPlan) * 100) : null;
      var passRate = periodQty > 0 ? ((periodOk / periodQty) * 100).toFixed(1) : '&#8212;';
      var reasons = aggregateReasons(periodRows);
      rows += '<tr class="' + (si === 0 ? 'grouphead' : '') + '">' +
        (si === 0 ? '<td rowspan="' + shifts.length * 2 + '"><div class="stationname">' + stName + '</div></td>' : '') +
        '<td><span class="shiftpill"><i style="background:' + shiftColor(g.shift) + '"></i>Zmiana ' + g.shift + '</span></td>' +
        cells + '<td><span class="rowtotal">' + fmt(periodActual) + '</span></td></tr>' +
        '<tr class="subrow"><td colspan="' + days.length + '">wykonanie · 完成率: <span class="pct ' + pctClass(periodPct) + '" style="margin-left:4px">' + (periodPct === null ? '&#8212;' : periodPct + '%') + '</span>' +
        '<button type="button" class="reasonbtn" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\')">Powody braków &#9662; <span class="cn">原因</span></button>' +
        '<div class="reasonbox">' + reasonsHtml(reasons) + '</div>' +
        '</td><td class="pr">pass · 合格率 ' + passRate + '%</td></tr>';
    });
  });
  table.innerHTML = thead + '<tbody>' + rows + '</tbody>';
}

function renderBars(groups) {
  var el = document.getElementById('bars');
  if (!groups.length) { el.innerHTML = '<div class="empty">Brak danych. <span class="cn">无数据。</span></div>'; return; }
  var byStation = {};
  var order = [];
  groups.forEach(function(g) {
    if (!byStation[g.station]) { byStation[g.station] = { actual: 0, plan: 0 }; order.push(g.station); }
    Object.keys(g.byDate).forEach(function(d) { byStation[g.station].actual += g.byDate[d].qty; byStation[g.station].plan += g.byDate[d].plan; });
  });
  el.innerHTML = order.map(function(name) {
    var s = byStation[name];
    var pct = s.plan > 0 ? Math.round((s.actual / s.plan) * 100) : 0;
    var color = pct >= 95 ? 'var(--green)' : pct >= 80 ? 'var(--orange)' : 'var(--red)';
    return '<div class="barrow"><div class="barrow-lbl">' + name + '</div>' +
      '<div class="bartrack"><div class="barfill" style="width:' + Math.min(pct, 100) + '%;background:' + color + '"></div></div>' +
      '<div class="barrow-pct"><b style="color:' + color + '">' + pct + '%</b> &nbsp;' + fmt(s.actual) + '/' + fmt(s.plan) + '</div></div>';
  }).join('');
}

// Bilans reworku per strefa — ile faktycznie trafilo do przetworzenia
// (processed = odzyskane + zlom koncowy), ile z tego wroci jako DOBRE
// sztuki, a ile ostatecznie poszlo na zlom. To CELOWO osobny wskaznik od
// pass rate raportu zmiany (patrz rozmowa o rozliczaniu reworku) — pass
// rate zostaje "jak bylo w momencie raportu", a tu widac realny odzysk.
function renderReworkBalance(days) {
  var el = document.getElementById('reworkBalance');
  var rows = STATE.reworkRows.filter(function(r) { return days.indexOf(r.date) >= 0; });
  if (!rows.length) { el.innerHTML = '<div class="empty">Brak przetworzeń reworku w tym okresie. <span class="cn">本期无返修处理记录。</span></div>'; return; }
  var byZone = {};
  var order = [];
  rows.forEach(function(r) {
    if (!byZone[r.zone]) { byZone[r.zone] = { label: r.zone_label || r.zone, processed: 0, recovered: 0, finalScrap: 0 }; order.push(r.zone); }
    var z = byZone[r.zone];
    z.processed += r.processed; z.recovered += r.recovered; z.finalScrap += r.final_scrap;
  });
  el.innerHTML = order.map(function(key) {
    var z = byZone[key];
    var pct = z.processed > 0 ? Math.round((z.recovered / z.processed) * 100) : 0;
    var color = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';
    return '<div class="barrow"><div class="barrow-lbl">' + z.label + '</div>' +
      '<div class="bartrack"><div class="barfill" style="width:' + Math.min(pct, 100) + '%;background:' + color + '"></div></div>' +
      '<div class="barrow-pct"><b style="color:' + color + '">' + pct + '%</b> &nbsp;odzysk ' + fmt(z.recovered) + '/' + fmt(z.processed) + ' &#183; złom ' + fmt(z.finalScrap) + '</div></div>';
  }).join('');
}

init();
</script>
</body>
</html>
