<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>CFM · Statystyki</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Cg fill='%231A6ED8'%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(0 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(120 50 50)'/%3E%3Cellipse cx='50' cy='30' rx='9' ry='18' transform='rotate(240 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='9' fill='%230d0d0d' stroke='%231A6ED8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#161616;--surface-2:#1c1c1c;--border:#262626;--border-soft:#1e1e1e;
  --text:#f2f2f2;--muted:#9a9a9a;--faint:#5c5c5c;
  --blue:#1A6ED8;--blue-soft:#2f7fe0;--green:#1A9E50;--red:#D92B2B;--orange:#D97706;
  --shift-a:#5AA9FF;--shift-b:#1A6ED8;--shift-c:#0B3D91;
  --good-bg:rgba(26,158,80,0.14);--warn-bg:rgba(217,119,6,0.16);--crit-bg:rgba(217,43,43,0.16);
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fc:'PingFang SC','Microsoft YaHei',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.cn{font-family:var(--fc);color:var(--faint);font-weight:400}
::selection{background:var(--blue);color:#fff}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:0.5px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.topbar-right{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
.topbar-right .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.topbar-right .live.off{color:var(--red)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-pulse{animation:none}}

.pagehead{padding:28px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-family:var(--fh);font-weight:800;font-size:30px;letter-spacing:0.2px}
h1 .cn{font-family:var(--fc);font-size:16px;font-weight:500;margin-left:8px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.monthnav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px}
.monthnav button{background:none;border:none;color:var(--muted);font-size:18px;padding:6px 12px;cursor:pointer;border-radius:8px}
.monthnav button:hover{color:var(--text);background:var(--surface-2)}
.monthnav .mlabel{font-family:var(--fh);font-weight:700;font-size:14px;letter-spacing:0.3px;text-transform:uppercase;min-width:130px;text-align:center}
.monthnav .mlabel .cn{font-size:11px;text-transform:none;margin-left:4px}

.weekpicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.weekpicker button{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:0.02em;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.weekpicker button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.weekpicker button:not(.on):hover{color:var(--text);border-color:var(--faint)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
.kpi-lbl .cn{display:block;text-transform:none;font-size:11px;margin-top:2px;letter-spacing:0}
.kpi-val{font-family:var(--fh);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;margin-top:8px;font-weight:600;color:var(--faint)}
.kpi-bar{height:4px;border-radius:2px;background:var(--border-soft);margin-top:12px;overflow:hidden}
.kpi-bar i{display:block;height:100%;border-radius:2px;transition:width .5s}

.section{margin-bottom:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.section-head h2{font-family:var(--fh);font-weight:700;font-size:19px;letter-spacing:0.2px}
.section-head h2 .cn{font-family:var(--fc);font-size:13px;font-weight:500;margin-left:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tablescroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
thead th{font-family:var(--fb);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:right;padding:12px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th.today{color:var(--blue-soft)}
thead th .cn{display:block;text-transform:none;font-size:9.5px;color:var(--faint);margin-top:2px}
tbody td{padding:9px 12px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr.grouphead td{padding-top:16px}
.stationname{font-family:var(--fh);font-weight:700;font-size:15px;color:var(--text)}
.shiftpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:0.03em}
.shiftpill i{width:7px;height:7px;border-radius:50%}
.cell-stack{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cell-actual{font-weight:700;color:var(--text)}
.cell-plan{font-size:10.5px;color:var(--faint)}
.pct{display:inline-block;min-width:48px;padding:3px 7px;border-radius:6px;font-weight:700;font-size:12px}
.pct.good{background:var(--good-bg);color:#3fd17a}
.pct.warn{background:var(--warn-bg);color:#f0a030}
.pct.crit{background:var(--crit-bg);color:#ff7070}
.pct.off{color:var(--faint);background:none;font-weight:500}
.rowtotal{font-weight:800;color:var(--text)}
.subrow td{padding-top:2px;padding-bottom:10px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--border-soft)}
.subrow .pr{font-variant-numeric:tabular-nums;font-weight:600}

.barsgrid{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.barrow{display:grid;grid-template-columns:170px 1fr 130px;align-items:center;gap:16px}
.barrow-lbl{font-family:var(--fh);font-weight:700;font-size:14px}
.bartrack{position:relative;height:22px;background:var(--border-soft);border-radius:6px;overflow:hidden}
.barfill{position:absolute;left:0;top:0;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.3,.8,.4,1)}
.barrow-pct{text-align:right;font-variant-numeric:tabular-nums}
.barrow-pct b{font-family:var(--fh);font-size:17px;font-weight:800}

.note{display:flex;gap:12px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}
.note .ic{font-family:var(--fh);font-weight:900;font-size:18px;color:var(--blue-soft);flex-shrink:0}
.empty{text-align:center;padding:60px 20px;color:var(--muted);line-height:1.8}
.empty a{color:var(--blue-soft)}

@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  h1{font-size:24px}
  .barrow{grid-template-columns:120px 1fr 90px;gap:10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="dot"></span>CFM</div>
    <div class="crumb"><b>Statystyki produkcji <span class="cn">生产统计</span></b></div>
    <div class="topbar-right">
      <div class="live" id="liveStatus"><span class="live-pulse"></span>łączenie&#8230; <span class="cn">连接中&#8230;</span></div>
      <div id="lastUpdate"></div>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>
</div>

<script>
function getWH() { return localStorage.getItem('cfm_raport_webhook') || ''; }

var STATE = { monthDate: new Date(), rows: [], weeks: [], selectedWeekIdx: 0 };

function pad(n) { return String(n).padStart(2, '0'); }
function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function mondayOf(d) { var x = new Date(d); var day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
var MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
var MONTH_NAMES_CN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var DAY_LABELS = ['PON','WT','ŚR','CZW','PT','SOB','NDZ'];
var DAY_LABELS_CN = ['周一','周二','周三','周四','周五','周六','周日'];

function monthRange(d) {
  var start = new Date(d.getFullYear(), d.getMonth(), 1);
  var end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start: toISO(start), end: toISO(end), startD: start, endD: end };
}

function init() {
  var wh = getWH();
  var liveEl = document.getElementById('liveStatus');
  if (!wh) {
    liveEl.className = 'live off';
    liveEl.innerHTML = '<span class="live-pulse"></span>brak połączenia <span class="cn">未连接</span>';
    document.getElementById('app').innerHTML = '<div class="empty">Nie skonfigurowano połączenia na tym urządzeniu.<br><span class="cn">此设备尚未配置连接。</span><br><br>Otwórz główną apkę CFM &#8594; Panel Admina &#8594; Połączenie, skonfiguruj Webhook URL, wróć tutaj i odśwież stronę.<br><span class="cn">打开CFM主应用 &#8594; 管理面板 &#8594; 连接，配置Webhook网址，然后返回此页面刷新。</span></div>';
    return;
  }
  loadMonth();
}

function loadMonth() {
  var wh = getWH();
  var r = monthRange(STATE.monthDate);
  document.getElementById('app').innerHTML = '<div class="empty">Ładowanie&#8230; · <span class="cn">加载中...</span></div>';
  fetch(wh + '?event_type=STATYSTYKI&start=' + r.start + '&end=' + r.end)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var liveEl = document.getElementById('liveStatus');
      if (data.status !== 'ok') {
        liveEl.className = 'live off';
        liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
        document.getElementById('app').innerHTML = '<div class="empty">Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span></div>';
        return;
      }
      liveEl.className = 'live';
      liveEl.innerHTML = '<span class="live-pulse"></span>zasilane z RaportDzienny <span class="cn">数据来自日报表</span>';
      document.getElementById('lastUpdate').textContent = 'odświeżono: ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) + ' · 已更新';
      STATE.rows = data.historia || [];
      computeWeeks();
      render();
    })
    .catch(function() {
      var liveEl = document.getElementById('liveStatus');
      liveEl.className = 'live off';
      liveEl.innerHTML = '<span class="live-pulse"></span>błąd połączenia <span class="cn">连接错误</span>';
      document.getElementById('app').innerHTML = '<div class="empty">Błąd połączenia z serwerem. <span class="cn">服务器连接错误。</span></div>';
    });
}

function computeWeeks() {
  var r = monthRange(STATE.monthDate);
  var firstMonday = mondayOf(r.startD);
  var weeks = [];
  var cursor = firstMonday;
  while (cursor <= r.endD) {
    var days = [];
    for (var i = 0; i < 7; i++) days.push(toISO(addDays(cursor, i)));
    weeks.push({ start: days[0], end: days[6], days: days });
    cursor = addDays(cursor, 7);
  }
  STATE.weeks = weeks;
  var todayISO = toISO(new Date());
  var idx = weeks.findIndex(function(w) { return todayISO >= w.start && todayISO <= w.end; });
  STATE.selectedWeekIdx = idx >= 0 ? idx : weeks.length - 1;
}

function groupByStationShift(rows) {
  var map = {};
  var order = [];
  rows.forEach(function(r) {
    var key = r.station + '||' + r.shift;
    if (!map[key]) { map[key] = { station: r.station, shift: r.shift, byDate: {} }; order.push(key); }
    map[key].byDate[r.date] = r;
  });
  order.sort(function(a, b) {
    var ga = map[a], gb = map[b];
    if (ga.station !== gb.station) return ga.station < gb.station ? -1 : 1;
    return ga.shift < gb.shift ? -1 : ga.shift > gb.shift ? 1 : 0;
  });
  return order.map(function(k) { return map[k]; });
}

function shiftColor(s) { return s === 'A' ? 'var(--shift-a)' : s === 'B' ? 'var(--shift-b)' : 'var(--shift-c)'; }
function pctClass(p) { if (p === null) return 'off'; if (p >= 95) return 'good'; if (p >= 80) return 'warn'; return 'crit'; }
function fmt(n) { return n === null || n === undefined ? '&#8212;' : n.toLocaleString('pl-PL'); }

function render() {
  var app = document.getElementById('app');
  if (!STATE.rows.length) {
    app.innerHTML = '<div class="pagehead"><div><h1>Plan vs. wykonanie <span class="cn">计划与完成</span></h1><div class="sub">' + MONTH_NAMES[STATE.monthDate.getMonth()] + ' ' + STATE.monthDate.getFullYear() + '</div></div>' + monthNavHtml() + '</div><div class="empty">Brak wpisów w tym miesiącu. <span class="cn">本月无记录。</span></div>';
    wireMonthNav();
    return;
  }

  var week = STATE.weeks[STATE.selectedWeekIdx];
  var groups = groupByStationShift(STATE.rows);
  var weekGroups = groupByStationShift(STATE.rows.filter(function(r) { return r.date >= week.start && r.date <= week.end; }));

  app.innerHTML =
    '<div class="pagehead"><div><h1>Plan vs. wykonanie <span class="cn">计划与完成</span></h1><div class="sub" id="weekLabel"></div></div>' + monthNavHtml() + '</div>' +
    '<div class="weekpicker" id="weekPicker"></div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<div class="section"><div class="section-head"><h2>Wykonanie planu &#183; dzień po dniu<span class="cn">计划完成率 &#183; 逐日</span></h2><div class="legend">' +
      '<span><i style="background:#3fd17a"></i>&#8805; 95%</span><span><i style="background:#f0a030"></i>80&#8211;94%</span><span><i style="background:#ff7070"></i>&lt; 80%</span>' +
    '</div></div><div class="tablewrap"><div class="tablescroll"><table id="pivot"></table></div></div></div>' +
    '<div class="section"><div class="section-head"><h2>Miesięczny bilans planu &#183; ' + MONTH_NAMES[STATE.monthDate.getMonth()].toLowerCase() + '<span class="cn">月度计划平衡</span></h2></div><div class="barsgrid" id="bars"></div></div>' +
    '<div class="note"><div class="ic">i</div><div><b>Dane na żywo z RaportDzienny.</b> <span class="cn">实时数据来自日报表。</span><br>Ta strona odczytuje ten sam arkusz co apka CFM (przez Apps Script) — nic nie trzeba ręcznie przepisywać, wystarczy wysyłać raporty jak zawsze.<br><span class="cn">此页面读取与CFM应用相同的表格（通过Apps Script）——无需手动重复录入，只需照常提交报告。</span></div></div>';

  wireMonthNav();
  renderWeekPicker();
  document.getElementById('weekLabel').textContent = fmtWeekRangePlain(week) + ' · ' + weekGroups.length + ' pozycji · ' + weekGroups.length + ' 项';
  renderKpis(weekGroups, week);
  renderPivot(weekGroups, week);
  renderBars(groups);
}

function fmtWeekRange(week) {
  var s = week.start.split('-'), e = week.end.split('-');
  return s[2] + '/' + s[1] + ' &#8211; ' + e[2] + '/' + e[1];
}
function fmtWeekRangePlain(week) {
  var s = week.start.split('-'), e = week.end.split('-');
  return s[2] + '/' + s[1] + ' – ' + e[2] + '/' + e[1];
}

function monthNavHtml() {
  return '<div class="monthnav"><button id="prevMonth">&#8249;</button><div class="mlabel">' + MONTH_NAMES[STATE.monthDate.getMonth()] + ' ' + STATE.monthDate.getFullYear() + '<span class="cn">' + MONTH_NAMES_CN[STATE.monthDate.getMonth()] + '</span></div><button id="nextMonth">&#8250;</button></div>';
}
function wireMonthNav() {
  document.getElementById('prevMonth').onclick = function() { STATE.monthDate = new Date(STATE.monthDate.getFullYear(), STATE.monthDate.getMonth() - 1, 1); loadMonth(); };
  document.getElementById('nextMonth').onclick = function() { STATE.monthDate = new Date(STATE.monthDate.getFullYear(), STATE.monthDate.getMonth() + 1, 1); loadMonth(); };
}

function renderWeekPicker() {
  var el = document.getElementById('weekPicker');
  el.innerHTML = STATE.weeks.map(function(w, i) {
    return '<button data-i="' + i + '" class="' + (i === STATE.selectedWeekIdx ? 'on' : '') + '">' + fmtWeekRange(w) + '</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(b) {
    b.onclick = function() { STATE.selectedWeekIdx = Number(b.dataset.i); render(); };
  });
}

function renderKpis(weekGroups, week) {
  var totalActual = 0, totalPlan = 0, totalOk = 0, totalNg = 0;
  weekGroups.forEach(function(g) {
    week.days.forEach(function(d) {
      var r = g.byDate[d];
      if (!r) return;
      totalActual += r.qty; totalPlan += r.plan; totalOk += r.ok_count; totalNg += (r.scrap + r.rework);
    });
  });
  var completion = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : null;
  var passRate = totalActual > 0 ? ((totalOk / totalActual) * 100).toFixed(1) : null;
  var kpis = [
    { lbl: 'Wykonanie planu (tydz.)', lblCn: '计划完成率（本周）', val: completion === null ? '&#8212;' : completion + '%', sub: 'plan: ' + fmt(totalPlan) + ' szt. · 计划', bar: completion === null ? 0 : Math.min(completion, 100), color: completion === null ? 'var(--faint)' : completion >= 95 ? 'var(--green)' : completion >= 80 ? 'var(--orange)' : 'var(--red)' },
    { lbl: 'Pass rate (tydz.)', lblCn: '合格率（本周）', val: passRate === null ? '&#8212;' : passRate + '%', sub: totalNg + ' szt. braków · 件不合格', bar: passRate || 0, color: 'var(--blue)' },
    { lbl: 'Wyprodukowano', lblCn: '已生产', val: fmt(totalActual), sub: 'zgodnych: ' + fmt(totalOk) + ' · 合格', bar: completion === null ? 0 : Math.min(completion, 100), color: 'var(--blue)' },
    { lbl: 'Wpisów w tygodniu', lblCn: '本周记录数', val: weekGroups.reduce(function(s, g) { return s + Object.keys(g.byDate).length; }, 0), sub: weekGroups.length + ' stanowisko/zmiana · 工位/班次', bar: 100, color: 'var(--faint)' }
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function(k) {
    return '<div class="kpi"><div class="kpi-lbl">' + k.lbl + '<span class="cn">' + k.lblCn + '</span></div><div class="kpi-val">' + k.val + '</div><div class="kpi-sub">' + k.sub + '</div><div class="kpi-bar"><i style="width:' + Math.max(3, k.bar) + '%;background:' + k.color + '"></i></div></div>';
  }).join('');
}

function renderPivot(weekGroups, week) {
  var table = document.getElementById('pivot');
  var todayISO = toISO(new Date());
  if (!weekGroups.length) { table.parentElement.parentElement.innerHTML = '<div class="empty">Brak wpisów w tym tygodniu. <span class="cn">本周无记录。</span></div>'; return; }
  var thead = '<thead><tr><th>Stanowisko<span class="cn">工位</span></th><th>Zmiana<span class="cn">班次</span></th>' +
    week.days.map(function(d, i) { var dd = d.split('-'); return '<th class="' + (d === todayISO ? 'today' : '') + '">' + DAY_LABELS[i] + '<br><span style="font-weight:400;text-transform:none;font-size:10px">' + dd[2] + '/' + dd[1] + '</span><span class="cn">' + DAY_LABELS_CN[i] + '</span></th>'; }).join('') +
    '<th>Suma tyg.<span class="cn">周总计</span></th></tr></thead>';

  var byStation = {};
  var stationOrder = [];
  weekGroups.forEach(function(g) { if (!byStation[g.station]) { byStation[g.station] = []; stationOrder.push(g.station); } byStation[g.station].push(g); });

  var rows = '';
  stationOrder.forEach(function(stName) {
    var shifts = byStation[stName];
    shifts.forEach(function(g, si) {
      var weekActual = 0, weekPlan = 0, weekOk = 0, weekQty = 0;
      var cells = week.days.map(function(d) {
        var r = g.byDate[d];
        if (!r) return '<td><span class="pct off">&#8212;</span></td>';
        weekActual += r.qty; weekPlan += r.plan; weekOk += r.ok_count; weekQty += r.qty;
        return '<td><div class="cell-stack"><span class="cell-actual">' + fmt(r.qty) + '</span><span class="cell-plan">/' + fmt(r.plan) + '</span></div></td>';
      }).join('');
      var weekPct = weekPlan > 0 ? Math.round((weekActual / weekPlan) * 100) : null;
      var passRate = weekQty > 0 ? ((weekOk / weekQty) * 100).toFixed(1) : '&#8212;';
      rows += '<tr class="' + (si === 0 ? 'grouphead' : '') + '">' +
        (si === 0 ? '<td rowspan="' + shifts.length * 2 + '"><div class="stationname">' + stName + '</div></td>' : '') +
        '<td><span class="shiftpill"><i style="background:' + shiftColor(g.shift) + '"></i>Zmiana ' + g.shift + '</span></td>' +
        cells + '<td><span class="rowtotal">' + fmt(weekActual) + '</span></td></tr>' +
        '<tr class="subrow"><td colspan="' + week.days.length + '">wykonanie tyg. · 本周完成率: <span class="pct ' + pctClass(weekPct) + '" style="margin-left:4px">' + (weekPct === null ? '&#8212;' : weekPct + '%') + '</span></td><td class="pr">pass · 合格率 ' + passRate + '%</td></tr>';
    });
  });
  table.innerHTML = thead + '<tbody>' + rows + '</tbody>';
}

function renderBars(groups) {
  var el = document.getElementById('bars');
  if (!groups.length) { el.innerHTML = '<div class="empty">Brak danych. <span class="cn">无数据。</span></div>'; return; }
  var byStation = {};
  var order = [];
  groups.forEach(function(g) {
    if (!byStation[g.station]) { byStation[g.station] = { actual: 0, plan: 0 }; order.push(g.station); }
    Object.keys(g.byDate).forEach(function(d) { byStation[g.station].actual += g.byDate[d].qty; byStation[g.station].plan += g.byDate[d].plan; });
  });
  el.innerHTML = order.map(function(name) {
    var s = byStation[name];
    var pct = s.plan > 0 ? Math.round((s.actual / s.plan) * 100) : 0;
    var color = pct >= 95 ? 'var(--green)' : pct >= 80 ? 'var(--orange)' : 'var(--red)';
    return '<div class="barrow"><div class="barrow-lbl">' + name + '</div>' +
      '<div class="bartrack"><div class="barfill" style="width:' + Math.min(pct, 100) + '%;background:' + color + '"></div></div>' +
      '<div class="barrow-pct"><b style="color:' + color + '">' + pct + '%</b> &nbsp;' + fmt(s.actual) + '/' + fmt(s.plan) + '</div></div>';
  }).join('');
}

init();
</script>
</body>
</html>
